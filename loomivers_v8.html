<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOOMIVERS V8</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050505; font-family: 'VT323', monospace; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        // ==========================================
        // MODULE: CORE & UTILS
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let currentScene = 'BOOT';
        let lastTime = 0;
        let score = 0;
        let gameTime = 0;

        function deepMerge(defaults, saved) {
            const result = { ...defaults };
            for (const key in saved) {
                if (typeof saved[key] === 'object' && saved[key] !== null && !Array.isArray(saved[key]) && typeof defaults[key] === 'object') {
                    result[key] = deepMerge(defaults[key], saved[key]);
                } else {
                    result[key] = saved[key];
                }
            }
            return result;
        }

        function hit(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        // ==========================================
        // MODULE: DATA & CONFIG
        // ==========================================
        const CHARACTERS = {
            WEAVER: { name: 'The Weaver', desc: 'Balanced. Starts with Neon Wand.', weapon: 'NEON_WAND', stat: 'Balanced', color: '#0ff', price: 0 },
            ARCHITECT: { name: 'The Architect', desc: 'Defensive. Orbiting Data Shield.', weapon: 'DATA_ORBIT', stat: 'Defense', color: '#00f', price: 0 },
            GLITCH_WITCH: { name: 'Glitch Witch', desc: 'Chaos. Spawns Reality Tears.', weapon: 'REALITY_TEAR', stat: 'Area Dmg', color: '#f0f', price: 0 },
            TANK: { name: 'The Tank', desc: 'Knockback King. Force Field.', weapon: 'FORCE_FIELD', stat: 'Health', color: '#0a0', price: 500 },
            SNIPER: { name: 'The Sniper', desc: 'Piercing Railgun.', weapon: 'PIXEL_RAIL', stat: 'Range', color: '#ff0', price: 500 },
            VIRUS: { name: 'The Virus', desc: 'Poison Trail.', weapon: 'CORRUPT_CLOUD', stat: 'DoT', color: '#0f0', price: 1000 },
            SUMMONER: { name: 'The Summoner', desc: 'Deploys Auto-Turrets.', weapon: 'AUTO_TURRET', stat: 'Minions', color: '#a0f', price: 1000 },
            NINJA: { name: 'The Ninja', desc: 'Bouncing Shuriken.', weapon: 'CYBER_SHURIKEN', stat: 'Agility', color: '#aaa', price: 1500 },
            BERSERKER: { name: 'The Berserker', desc: 'Melee Void Axe.', weapon: 'VOID_AXE', stat: 'Melee', color: '#f00', price: 2000 },
            GAMBLER: { name: 'The Gambler', desc: 'RNG Damage.', weapon: 'DICE_BOMB', stat: 'Luck', color: '#fa0', price: 2500 }
        };

        const DefaultGameData = {
            progress: {
                highScore: 0, currency: 0, skins: ['NEON_CYAN'], currentSkin: 'NEON_CYAN',
                unlockedChars: ['WEAVER', 'ARCHITECT', 'GLITCH_WITCH'],
                upgrades: { health: 0, magnet: 0, damage: 0, greed: 0 },
                achievements: [], bestiary: {}, nemesis: null, storySeen: false
            },
            settings: {
                masterVolume: 1.0, crtEffect: true, particles: 'High',
                joystickSide: 'Left', joystickSize: 'Medium', debugMode: false
            }
        };

        const GameData = {
            progress: { ...DefaultGameData.progress },
            settings: { ...DefaultGameData.settings },
            saveProgress() { localStorage.setItem('loomivers_progress', JSON.stringify(this.progress)); },
            saveSettings() { localStorage.setItem('loomivers_settings', JSON.stringify(this.settings)); },
            load() {
                try {
                    const p = localStorage.getItem('loomivers_progress');
                    if(p) this.progress = deepMerge(DefaultGameData.progress, JSON.parse(p));
                    const s = localStorage.getItem('loomivers_settings');
                    if(s) this.settings = deepMerge(DefaultGameData.settings, JSON.parse(s));
                } catch(e) { console.error("Save Load Error", e); }
            },
            resetProgress() {
                this.progress = JSON.parse(JSON.stringify(DefaultGameData.progress));
                this.saveProgress();
            }
        };
        GameData.load();

        // ==========================================
        // MODULE: SCENE MANAGEMENT & AUDIO
        // ==========================================
        const SceneManager = {
            bootTimer: 0,
            changeScene(name) {
                currentScene = name;
                input.clearTaps();
                if (name === 'PLAYING') audioController.startMusic();
                else audioController.stopMusic();
            },
            gameOver() {
                this.changeScene('GAME_OVER');
                // Save Logic
                if(score > GameData.progress.highScore) GameData.progress.highScore = score;
                // Nemesis Save
                if(enemyPool.active.length > 0) {
                    const killer = enemyPool.active[0];
                    GameData.progress.nemesis = { type: killer.type, hp: killer.hp, damage: 10, color: killer.color };
                }
                GameData.saveProgress();
            }
        };

        let audioCtx;
        class AudioController {
            constructor() { this.initialized = false; this.seqTimer = null; this.beat = 0; }
            init() {
                if(this.initialized) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AC();
                const b = audioCtx.createBuffer(1,1,22050);
                const s = audioCtx.createBufferSource(); s.buffer = b; s.connect(audioCtx.destination); s.start(0);
                if(audioCtx.state==='suspended') audioCtx.resume();
                this.initialized = true;
            }
            playTone(type, freq, dur, volMult=1.0) {
                if(!this.initialized || GameData.settings.masterVolume<=0) return;
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                g.gain.setValueAtTime(0.1*GameData.settings.masterVolume*volMult, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime+dur);
            }
            playPing() { this.playTone('sine', 800, 0.1); }
            playCrunch() { this.playTone('sawtooth', 100, 0.2); }
            playLevelUp() { [440,554,659,880].forEach((f,i)=>setTimeout(()=>this.playTone('square',f,0.1), i*100)); }
            startMusic() {
                if(this.seqTimer) return;
                const seq = [65.41, 65.41, 49.00, 49.00, 55.00, 55.00, 43.65, 43.65];
                this.seqTimer = setInterval(() => {
                    if(currentScene==='PLAYING') {
                        this.playTone('sawtooth', seq[this.beat++ % seq.length], 0.2, 0.3);
                    }
                }, 250);
            }
            stopMusic() { if(this.seqTimer) { clearInterval(this.seqTimer); this.seqTimer=null; } }
        }
        const audioController = new AudioController();
        const resumeAudio = () => { if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); audioController.init(); };
        window.addEventListener('touchstart', resumeAudio, {once:true});
        window.addEventListener('click', resumeAudio, {once:true});

        // ==========================================
        // MODULE: INPUT
        // ==========================================
        class InputHandler {
            constructor() {
                this.joystick = { x: 0, y: 0, active: false, originX: 0, originY: 0 };
                this.keys = {}; this.taps = [];
                this.setupTouch(); this.setupKeys();
            }
            setupTouch() {
                document.addEventListener('touchstart', e => {
                    const t = e.changedTouches[0];
                    if(currentScene !== 'PLAYING') { this.taps.push({x:t.clientX, y:t.clientY}); return; }
                    const side = GameData.settings.joystickSide;
                    const w = window.innerWidth;
                    if((side==='Left' && t.clientX < w/2) || (side==='Right' && t.clientX > w/2)) {
                        this.joystick.active = true; this.joystick.originX = t.clientX; this.joystick.originY = t.clientY;
                        this.joystick.x = 0; this.joystick.y = 0;
                    }
                    this.taps.push({x:t.clientX, y:t.clientY});
                }, {passive:false});
                document.addEventListener('touchmove', e => {
                    if(!this.joystick.active) return;
                    e.preventDefault();
                    const t = e.changedTouches[0];
                    const dx = t.clientX - this.joystick.originX, dy = t.clientY - this.joystick.originY;
                    const d = Math.sqrt(dx*dx+dy*dy);
                    let size = 50; if(GameData.settings.joystickSize==='Small') size=30; if(GameData.settings.joystickSize==='Large') size=70;
                    if(d>0) {
                        const a = Math.atan2(dy, dx);
                        const c = Math.min(d, size);
                        this.joystick.x = (Math.cos(a)*c)/size; this.joystick.y = (Math.sin(a)*c)/size;
                    }
                }, {passive:false});
                document.addEventListener('touchend', () => { this.joystick.active = false; this.joystick.x=0; this.joystick.y=0; });
                document.addEventListener('mousedown', e => this.taps.push({x:e.clientX, y:e.clientY}));
            }
            setupKeys() { window.addEventListener('keydown', e=>this.keys[e.code]=true); window.addEventListener('keyup', e=>this.keys[e.code]=false); }
            getMovement() {
                let dx=0, dy=0;
                if(this.keys['ArrowUp']||this.keys['KeyW']) dy-=1;
                if(this.keys['ArrowDown']||this.keys['KeyS']) dy+=1;
                if(this.keys['ArrowLeft']||this.keys['KeyA']) dx-=1;
                if(this.keys['ArrowRight']||this.keys['KeyD']) dx+=1;
                if(dx||dy) { const l = Math.sqrt(dx*dx+dy*dy); return {x:dx/l, y:dy/l}; }
                return {x:this.joystick.x, y:this.joystick.y};
            }
            checkTap(r) { return this.taps.some(t => t.x >= r.x && t.x <= r.x+r.w && t.y >= r.y && t.y <= r.y+r.h); }
            clearTaps() { this.taps = []; }
        }
        const input = new InputHandler();

        // ==========================================
        // MODULE: UI
        // ==========================================
        const UI = {
            buttons: [], sliders: [],
            drawButton(text, x, y, w, h, color, action) {
                ctx.fillStyle = color; ctx.fillRect(x,y,w,h);
                ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
                ctx.fillStyle = '#fff'; ctx.font='24px VT323'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(text, x+w/2, y+h/2);
                this.buttons.push({x,y,w,h,action});
            },
            drawSlider(label, val, x, y, w, h, cb) {
                ctx.fillStyle='#333'; ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h);
                ctx.fillStyle='#0f0'; ctx.fillRect(x,y,w*val,h);
                ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(`${label}: ${Math.round(val*100)}%`, x, y-15);
                this.sliders.push({x,y,w,h,cb});
            },
            drawSelector(label, opts, cur, x, y, w, h, cb) {
                ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(label, x, y-15);
                const ow = w/opts.length;
                opts.forEach((o,i) => {
                    const ox = x + i*ow;
                    const sel = o===cur;
                    ctx.fillStyle = sel ? '#0a0':'#333'; ctx.fillRect(ox,y,ow,h); ctx.strokeRect(ox,y,ow,h);
                    ctx.fillStyle = sel ? '#fff':'#aaa'; ctx.textAlign='center'; ctx.fillText(o, ox+ow/2, y+h/2);
                    this.buttons.push({x:ox, y, w:ow, h, action:()=>cb(o)});
                });
            },
            drawToggle(l, v, x, y, w, h, cb) { this.drawSelector(l, ['OFF','ON'], v?'ON':'OFF', x,y,w,h, val=>cb(val==='ON')); },
            handleInput() {
                this.buttons.forEach(b => { if(input.checkTap(b)) { audioController.playPing(); b.action(); } });
                this.sliders.forEach(s => {
                    input.taps.forEach(t => {
                        if(t.x>=s.x && t.x<=s.x+s.w && t.y>=s.y && t.y<=s.y+s.h) s.cb(Math.max(0, Math.min(1, (t.x-s.x)/s.w)));
                    });
                });
                this.buttons=[]; this.sliders=[];
            }
        };

        // ==========================================
        // MODULE: ENTITIES & POOL
        // ==========================================
        class ObjectPool {
            constructor(fn, n=100) { this.fn=fn; this.pool=[]; this.active=[]; for(let i=0;i<n;i++) this.pool.push(fn()); }
            get() { const o = this.pool.length?this.pool.pop():this.fn(); o.active=true; this.active.push(o); return o; }
            release(o) { const i=this.active.indexOf(o); if(i>-1){ this.active.splice(i,1); o.active=false; this.pool.push(o); } }
            reset() { while(this.active.length) { const o=this.active.pop(); o.active=false; this.pool.push(o); } }
        }

        class Player {
            constructor() {
                this.x=0; this.y=0; this.w=20; this.h=20;
                this.speed=200; this.hp=100; this.maxHp=100; this.xp=0; this.nextLevelXp=10; this.level=1;
                this.weapons=[]; this.iframeTimer=0; this.color='#0ff'; this.damageMult=1; this.fireRateMult=1;
                this.glitchMeter=0; this.glitchMax=100; this.overdriveActive=false; this.overdriveTimer=0;
            }
            init(charType) {
                const c = CHARACTERS[charType] || CHARACTERS.WEAVER;
                this.reset(); this.color = c.color; this.addWeapon(c.weapon);
                if(charType==='ARCHITECT') this.maxHp+=20;
                if(charType==='TANK') { this.maxHp+=50; this.speed-=20; }
                if(charType==='SNIPER') this.damageMult+=0.2;
                if(charType==='NINJA') this.speed+=40;
                if(charType==='BERSERKER') { this.damageMult+=0.5; this.maxHp+=30; }
                this.hp = this.maxHp;
            }
            reset() {
                this.maxHp = 100 + (GameData.progress.upgrades.health*10);
                this.damageMult = 1.0 + (GameData.progress.upgrades.damage*0.05);
                this.x=canvas.width/2; this.y=canvas.height/2; this.hp=this.maxHp; this.speed=200; this.xp=0; this.level=1;
                this.iframeTimer=0; this.weapons=[]; this.fireRateMult=1; this.glitchMeter=0; this.overdriveActive=false;
            }
            activateOverdrive() {
                if(this.glitchMeter >= this.glitchMax && !this.overdriveActive) {
                    this.overdriveActive=true; this.overdriveTimer=5; this.glitchMeter=0; addShake(20);
                }
            }
            addWeapon(type) {
                const w = { type, cooldown:0, level:1 };
                if(type==='NEON_WAND') { w.fireRate=0.5; w.damage=10; }
                else if(type==='DATA_ORBIT') { w.fireRate=0; w.damage=5; w.angle=0; }
                else if(type==='GLITCH_BOMB') { w.fireRate=2; w.damage=30; }
                else if(type==='REALITY_TEAR') { w.fireRate=3; w.damage=50; }
                else if(type==='FORCE_FIELD') { w.fireRate=1.5; w.damage=10; w.pushback=200; }
                else if(type==='PIXEL_RAIL') { w.fireRate=1.5; w.damage=25; }
                else if(type==='CORRUPT_CLOUD') { w.fireRate=0.5; w.damage=5; }
                else if(type==='AUTO_TURRET') { w.fireRate=5; w.damage=10; }
                else if(type==='CYBER_SHURIKEN') { w.fireRate=0.8; w.damage=15; }
                else if(type==='VOID_AXE') { w.fireRate=1; w.damage=40; }
                else if(type==='DICE_BOMB') { w.fireRate=1.5; w.damage=0; }
                this.weapons.push(w);
            }
            update(dt) {
                let sm=1, fm=1;
                if(this.overdriveActive) { this.overdriveTimer-=dt; sm=2; fm=2; this.iframeTimer=0.1; if(this.overdriveTimer<=0) { this.overdriveActive=false; corruptionLevel++; } }
                const mv = input.getMovement();
                this.x += mv.x * this.speed * sm * dt; this.y += mv.y * this.speed * sm * dt;
                this.x = Math.max(0, Math.min(canvas.width-this.w, this.x));
                this.y = Math.max(0, Math.min(canvas.height-this.h, this.y));
                if(this.iframeTimer>0) this.iframeTimer-=dt;

                this.weapons.forEach(w => {
                    if(w.type==='DATA_ORBIT') w.angle += 3*dt*fm;
                    else { w.cooldown-=dt*fm; if(w.cooldown<=0) fireWeaponGlobal(this, w); }
                });
            }
            takeDamage(amt) {
                if(this.iframeTimer>0) return;
                this.hp -= amt; this.iframeTimer = 0.5;
                if(this.hp <= 0) SceneManager.gameOver();
            }
            gainXp(amt) {
                this.xp += amt; audioController.playPing();
                if(this.xp >= this.nextLevelXp) {
                    this.xp -= this.nextLevelXp; this.level++; this.nextLevelXp = Math.floor(this.nextLevelXp*1.5);
                    audioController.playLevelUp(); triggerLevelUpScreen();
                }
            }
        }
        const player = new Player();

        class Enemy {
            constructor() { this.active=false; }
            init(type, x, y) {
                this.active=true; this.type=type; this.x=x; this.y=y;
                this.flashTimer=0; this.kbX=0; this.kbY=0; this.atkTimer=0;
                if(type==='SWARMER') { this.w=15; this.h=15; this.hp=10+player.level*2; this.speed=80; this.color='#f00'; }
                else if(type==='TANK') { this.w=30; this.h=30; this.hp=50+player.level*10; this.speed=40; this.color='#900'; }
                else if(type==='GLITCH_MITE') { this.w=12; this.h=12; this.hp=5+player.level; this.speed=120; this.color='#ff0'; }
                else if(type==='WARDEN') { this.w=60; this.h=60; this.hp=5000+player.level*100; this.maxHp=this.hp; this.speed=60; this.color='#f0f'; }
                if(endlessMode) { this.hp*=1.5; this.speed*=1.5; }
            }
            update(dt) {
                if(!this.active) return;
                if(this.flashTimer>0) this.flashTimer-=dt;
                if(Math.abs(this.kbX)>1 || Math.abs(this.kbY)>1) {
                    this.x+=this.kbX*dt; this.y+=this.kbY*dt; this.kbX*=0.9; this.kbY*=0.9;
                } else {
                    let sepX=0, sepY=0;
                    if(this.type!=='WARDEN') {
                        let c=0;
                        for(const o of enemyPool.active) {
                            if(c>10) break; if(o===this || o.type==='WARDEN') continue;
                            const dx=this.x-o.x, dy=this.y-o.y;
                            if(Math.abs(dx)>30 || Math.abs(dy)>30) continue;
                            const d2=dx*dx+dy*dy;
                            if(d2<900 && d2>0) { const d=Math.sqrt(d2); sepX+=(dx/d)*((30-d)/30)*100; sepY+=(dy/d)*((30-d)/30)*100; c++; }
                        }
                    }
                    const dx=player.x-this.x, dy=player.y-this.y;
                    const d=Math.sqrt(dx*dx+dy*dy);
                    if(d>0) { this.x+=(dx/d*this.speed + sepX)*dt; this.y+=(dy/d*this.speed + sepY)*dt; }

                    if(this.type==='WARDEN') {
                        this.atkTimer+=dt;
                        const rate = this.hp < this.maxHp*0.5 ? 1 : 2;
                        if(this.atkTimer>rate) {
                            this.atkTimer=0;
                            for(let i=-1; i<=1; i++) projectilePool.get().init('BOSS_ORB', this.x+this.w/2, this.y+this.h/2, player.x+i*50, player.y+i*50, 20, true);
                            audioController.playCrunch();
                        }
                    } else if(this.type==='TANK' && Math.random()<0.05) spawnParticle(this.x+this.w/2, this.y+this.h/2, '#500');
                }
            }
            takeDamage(amt, kb=0, sx=0, sy=0) {
                this.hp-=amt; this.flashTimer=0.1;
                if(kb>0) { const dx=this.x-sx, dy=this.y-sy, d=Math.sqrt(dx*dx+dy*dy)||1; this.kbX=(dx/d)*kb; this.kbY=(dy/d)*kb; }
                spawnDamageText(amt, this.x, this.y);
                if(this.hp<=0) this.die();
            }
            die() {
                this.active=false; audioController.playCrunch(); enemyPool.release(this);
                if(Math.random()<0.1) spawnGem(this.x,this.y,10,true); else spawnGem(this.x,this.y,this.type==='TANK'?5:1,false);
                if(player.glitchMeter<player.glitchMax) player.glitchMeter++;
                for(let i=0;i<3;i++) spawnParticle(this.x,this.y,this.color);
                score += this.type==='TANK'?50:10;
                if(this.type==='WARDEN') { endlessMode=true; spawnDamageText("ENDLESS MODE!", player.x, player.y); addShake(50); }
                if(this.isNemesis) { player.gainXp(100); GameData.progress.nemesis=null; GameData.saveProgress(); spawnDamageText("NEMESIS DEAD!", this.x, this.y); }
            }
        }
        const enemyPool = new ObjectPool(()=>new Enemy(), 200);

        class Projectile {
            constructor() { this.active=false; }
            init(type, x, y, tx, ty, dmg, isEnemy=false) {
                this.active=true; this.type=type; this.x=x; this.y=y; this.damage=dmg; this.isEnemy=isEnemy;
                this.dur=3; this.vx=0; this.vy=0; this.w=10; this.h=10;

                if(['NEON_WAND','BOSS_ORB','CYBER_SHURIKEN','DICE_BOMB'].includes(type)) {
                    const s = type==='BOSS_ORB'?150 : type==='CYBER_SHURIKEN'?300 : type==='DICE_BOMB'?250 : 400;
                    const dx=tx-x, dy=ty-y, d=Math.sqrt(dx*dx+dy*dy)||1;
                    this.vx=(dx/d)*s; this.vy=(dy/d)*s; this.w=8; this.h=8;
                    if(type==='CYBER_SHURIKEN') this.bounces=3;
                } else if(type==='GLITCH_BOMB') {
                    const dx=tx-x, dy=ty-y, d=Math.sqrt(dx*dx+dy*dy)||1; this.vx=(dx/d)*200; this.vy=(dy/d)*200; this.w=16; this.h=16;
                } else if(type==='PIXEL_RAIL') { this.dur=0.2; this.tx=tx; this.ty=ty; }
                else if(type==='REALITY_TEAR' || type==='CORRUPT_CLOUD') { this.dur=5; this.w=40; this.h=40; }
                else if(type==='VOID_AXE') { this.dur=0.3; this.vx=tx-x; this.vy=ty-y; this.w=60; this.h=60; }
                else if(type==='AUTO_TURRET') { this.dur=10; this.fireTimer=0; this.w=20; this.h=20; }
            }
            update(dt) {
                if(!this.active) return;
                if(this.type==='AUTO_TURRET') {
                    this.fireTimer+=dt;
                    if(this.fireTimer>1) {
                        this.fireTimer=0;
                        let near=null, min=99999;
                        for(const e of enemyPool.active) { const d=(e.x-this.x)**2+(e.y-this.y)**2; if(d<min){ min=d; near=e; } }
                        if(near) projectilePool.get().init('NEON_WAND', this.x, this.y, near.x, near.y, this.damage);
                    }
                } else if(this.type==='CYBER_SHURIKEN') {
                    this.x+=this.vx*dt; this.y+=this.vy*dt;
                    if(this.x<0||this.x>canvas.width) { this.vx*=-1; this.bounces--; }
                    if(this.y<0||this.y>canvas.height) { this.vy*=-1; this.bounces--; }
                    if(this.bounces<0) this.dur=0;
                } else if(!['REALITY_TEAR','CORRUPT_CLOUD','PIXEL_RAIL','VOID_AXE'].includes(this.type)) {
                    this.x+=this.vx*dt; this.y+=this.vy*dt;
                }
                this.dur-=dt; if(this.dur<=0) projectilePool.release(this);
            }
        }
        const projectilePool = new ObjectPool(()=>new Projectile(), 200);

        class Gem { constructor(){this.active=false;} init(x,y,v,d){ this.active=true; this.x=x; this.y=y; this.val=v; this.isData=d; this.w=d?12:8; this.h=d?12:8; } }
        const gemPool = new ObjectPool(()=>new Gem(), 200);
        class Particle { constructor(){this.active=false;} init(x,y,c){ this.active=true; this.x=x; this.y=y; this.c=c; this.life=0.5+Math.random()*0.5; const a=Math.random()*6.28, s=Math.random()*200+50; this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s; } update(dt){ if(!this.active)return; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=0.95; this.vy*=0.95; this.life-=dt; if(this.life<=0) particlePool.release(this); } }
        const particlePool = new ObjectPool(()=>new Particle(), 200);
        class DamageText { constructor(){this.active=false;} init(a,x,y){ this.active=true; this.x=x; this.y=y; this.txt=typeof a==='number'?Math.floor(a):a; this.life=0.8; } update(dt){ if(!this.active)return; this.y-=50*dt; this.life-=dt; if(this.life<=0) damageTextPool.release(this); } }
        const damageTextPool = new ObjectPool(()=>new DamageText(), 50);

        function spawnGem(x,y,v,d){gemPool.get().init(x,y,v,d);}
        function spawnParticle(x,y,c){particlePool.get().init(x,y,c);}
        function spawnDamageText(a,x,y){damageTextPool.get().init(a,x,y);}
        function createExplosion(x,y,d,p=0){ addShake(10); for(const e of enemyPool.active) { if(Math.sqrt((e.x-x)**2+(e.y-y)**2)<100) e.takeDamage(d,p,x,y); } for(let i=0;i<10;i++)spawnParticle(x,y,'#ff0'); }

        function fireWeaponGlobal(p, w) {
            let near=null, min=99999;
            for(const e of enemyPool.active) { const d=(e.x-p.x)**2+(e.y-p.y)**2; if(d<min){ min=d; near=e; } }
            w.cooldown = w.fireRate * p.fireRateMult;
            const dmg = w.damage * p.damageMult;

            if(w.type==='NEON_WAND' && near) projectilePool.get().init('NEON_WAND', p.x, p.y, near.x, near.y, dmg);
            else if(w.type==='GLITCH_BOMB') {
                const tx=near?near.x : p.x+Math.cos(Math.random()*6.28)*150, ty=near?near.y : p.y+Math.sin(Math.random()*6.28)*150;
                projectilePool.get().init('GLITCH_BOMB', p.x, p.y, tx, ty, dmg);
            }
            else if(w.type==='REALITY_TEAR') projectilePool.get().init('REALITY_TEAR', p.x+(Math.random()-0.5)*300, p.y+(Math.random()-0.5)*300, 0, 0, dmg);
            else if(w.type==='FORCE_FIELD') createExplosion(p.x, p.y, dmg, w.pushback);
            else if(w.type==='PIXEL_RAIL' && near) {
                const a = Math.atan2(near.y-p.y, near.x-p.x);
                projectilePool.get().init('PIXEL_RAIL', p.x, p.y, p.x+Math.cos(a)*1000, p.y+Math.sin(a)*1000, dmg);
            }
            else if(w.type==='CORRUPT_CLOUD') projectilePool.get().init('CORRUPT_CLOUD', p.x, p.y, 0, 0, dmg);
            else if(w.type==='AUTO_TURRET') projectilePool.get().init('AUTO_TURRET', p.x, p.y, 0, 0, dmg);
            else if(w.type==='CYBER_SHURIKEN' && near) projectilePool.get().init('CYBER_SHURIKEN', p.x, p.y, near.x, near.y, dmg);
            else if(w.type==='VOID_AXE') { const tx=near?near.x:p.x+100, ty=near?near.y:p.y; projectilePool.get().init('VOID_AXE', p.x, p.y, tx, ty, dmg); }
            else if(w.type==='DICE_BOMB' && near) { const r=Math.floor(Math.random()*100)+1; projectilePool.get().init('DICE_BOMB', p.x, p.y, near.x, near.y, r); }
        }

        // ==========================================
        // MODULE: SCENES & LOOP
        // ==========================================
        let upgradeChoices = [];
        const WEAPON_TYPES = ['NEON_WAND', 'DATA_ORBIT', 'GLITCH_BOMB', 'REALITY_TEAR', 'FORCE_FIELD', 'PIXEL_RAIL', 'CORRUPT_CLOUD', 'AUTO_TURRET', 'CYBER_SHURIKEN', 'VOID_AXE', 'DICE_BOMB'];
        function triggerLevelUpScreen() {
            SceneManager.changeScene('LEVEL_UP');
            upgradeChoices = [];
            while(upgradeChoices.length<3) {
                const r=Math.random(); let pick;
                if(r<0.3) pick={id:'HEAL', t:'Repair', d:'+50 HP'}; else if(r<0.6) pick={id:'DMG', t:'Power', d:'+20% Dmg'}; else { const w=WEAPON_TYPES[Math.floor(Math.random()*WEAPON_TYPES.length)]; pick={id:w, t:w.replace('_',' '), d:'New Weapon'}; }
                if(!upgradeChoices.find(c=>c.id===pick.id)) upgradeChoices.push(pick);
            }
        }
        function selectUpgrade(id) {
            if(id==='HEAL') player.hp=Math.min(player.maxHp, player.hp+50); else if(id==='DMG') player.damageMult*=1.2; else { const e=player.weapons.find(w=>w.type===id); if(e){e.level++; e.damage*=1.2;} else player.addWeapon(id); }
            SceneManager.changeScene('PLAYING'); lastTime=performance.now(); requestAnimationFrame(gameLoop);
        }

        let spawnTimer=0, waveTimer=0, corruptionLevel=0, nemesisSpawned=false, bossSpawned=false, endlessMode=false;
        function updateGame(dt) {
            gameTime+=dt; spawnTimer+=dt; waveTimer+=dt;
            const diff = 1 + corruptionLevel*0.1 + (endlessMode?0.5:0);
            const rate = Math.max(0.1, (1.5 - gameTime/60 * 0.1)/diff);

            if(!bossSpawned && gameTime>120) { bossSpawned=true; enemyPool.get().init('WARDEN', player.x+400, player.y); spawnDamageText("WARDEN DETECTED", player.x, player.y-100); }
            if(spawnTimer>rate && (!bossSpawned || endlessMode)) {
                spawnTimer=0; const a=Math.random()*6.28, r=500; const sx=player.x+Math.cos(a)*r, sy=player.y+Math.sin(a)*r;
                let t='SWARMER'; if(Math.random()>0.9) t='GLITCH_MITE'; else if(Math.random()>0.85) t='TANK';
                enemyPool.get().init(t, sx, sy);
            }

            player.update(dt);
            enemyPool.active.forEach(e=>e.update(dt));
            projectilePool.active.forEach(p=>p.update(dt));
            gemPool.active.forEach(g=>{
                const d = Math.sqrt((player.x-g.x)**2+(player.y-g.y)**2);
                if(d<100) { g.x+=(player.x-g.x)/d*300*dt; g.y+=(player.y-g.y)/d*300*dt; }
                if(hit(player, g)) { if(g.isData) { GameData.progress.currency+=g.val; spawnDamageText("+$"+g.val, player.x, player.y-20); audioController.playPing(); } else player.gainXp(g.val); gemPool.release(g); }
            });
            particlePool.active.forEach(p=>p.update(dt));
            damageTextPool.active.forEach(t=>t.update(dt));

            if(player.iframeTimer<=0) { for(const e of enemyPool.active) { if(hit(player, e)) { player.takeDamage(10); addShake(10); break; } } }

            projectilePool.active.forEach(p => {
                if(p.isEnemy) { if(hit(player, p)) { player.takeDamage(p.damage); projectilePool.release(p); } }
                else if(p.type==='PIXEL_RAIL') {} // Visual only beam, damage handled elsewhere or TODO
                else if(['REALITY_TEAR','CORRUPT_CLOUD','VOID_AXE'].includes(p.type)) {
                    enemyPool.active.forEach(e => { if(hit(p, e) && Math.random()<0.1) e.takeDamage(p.damage); });
                } else {
                    for(const e of enemyPool.active) {
                        if(hit(p, e)) {
                            if(['GLITCH_BOMB','DICE_BOMB'].includes(p.type)) createExplosion(p.x, p.y, p.damage); else e.takeDamage(p.damage, 100, p.x, p.y);
                            if(!p.penetrate) { projectilePool.release(p); break; }
                        }
                    }
                }
            });

            const orb = player.weapons.find(w=>w.type==='DATA_ORBIT');
            if(orb) {
                const ox=player.x+10+Math.cos(orb.angle)*60, oy=player.y+10+Math.sin(orb.angle)*60;
                enemyPool.active.forEach(e => { if(Math.sqrt((e.x-ox)**2+(e.y-oy)**2)<30 && Math.random()<0.1) e.takeDamage(orb.damage, 10, player.x, player.y); });
            }
        }

        function drawGridBackground(t) {
            ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.beginPath();
            const s = (t*20)%50;
            for(let x=0;x<canvas.width;x+=50) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
            for(let y=s;y<canvas.height;y+=50) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
            ctx.stroke();
        }

        function render() {
            ctx.setTransform(1,0,0,1,0,0);
            ctx.fillStyle='#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);

            // Grid
            ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.beginPath();
            const gx=-(player.x%50), gy=-(player.y%50);
            for(let i=gx; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
            for(let i=gy; i<canvas.height; i+=50) { ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); }
            ctx.stroke();

            if(shakeIntensity>0) { ctx.translate((Math.random()-.5)*shakeIntensity, (Math.random()-.5)*shakeIntensity); shakeIntensity*=0.9; }

            ctx.save();
            // Camera Center
            ctx.translate(canvas.width/2 - player.x - player.w/2, canvas.height/2 - player.y - player.h/2);

            const all = [
                {y:player.y+player.h, d:()=>drawEntity(player, player.color)},
                ...enemyPool.active.map(e=>({y:e.y+e.h, d:()=>drawEntity(e, e.flashTimer>0?'#fff':e.color)})),
                ...gemPool.active.map(g=>({y:g.y+g.h, d:()=>drawGem(g)}))
            ].sort((a,b)=>a.y-b.y);

            all.forEach(x=>x.d());

            projectilePool.active.forEach(p=>drawProjectile(p));
            particlePool.active.forEach(p=>{ ctx.fillStyle=p.c; ctx.globalAlpha=p.life*2; ctx.fillRect(p.x,p.y,4,4); ctx.globalAlpha=1; });
            damageTextPool.active.forEach(t=>{ ctx.fillStyle='#fff'; ctx.font='30px VT323'; ctx.fillText(t.txt, t.x, t.y); });

            // Orbit
            const o = player.weapons.find(w=>w.type==='DATA_ORBIT');
            if(o) { ctx.fillStyle='#0ff'; ctx.beginPath(); ctx.arc(player.x+10+Math.cos(o.angle)*60, player.y+10+Math.sin(o.angle)*60, 5, 0, 6.28); ctx.fill(); }

            // DEBUG
            if(GameData.settings.debugMode) {
                ctx.strokeStyle='red'; ctx.lineWidth=1;
                [player, ...enemyPool.active, ...projectilePool.active, ...gemPool.active].forEach(e => ctx.strokeRect(e.x, e.y, e.w, e.h));
            }

            ctx.restore();

            // HUD
            ctx.fillStyle='#fff'; ctx.font='24px VT323'; ctx.textAlign='left';
            ctx.fillText(`SCORE: ${score}`, 20, 40);
            ctx.fillText(`TIME: ${Math.floor(gameTime/60)}:${(Math.floor(gameTime%60)+"").padStart(2,'0')}`, 20, 70);

            const bx=(canvas.width-200)/2, by=canvas.height-40;
            ctx.fillStyle='#333'; ctx.fillRect(bx,by,200,20);
            ctx.fillStyle='#0f0'; ctx.fillRect(bx,by,200*(Math.max(0,player.hp)/player.maxHp),20);
            ctx.strokeStyle='#fff'; ctx.strokeRect(bx,by,200,20);

            const boss = enemyPool.active.find(e=>e.type==='WARDEN');
            if(boss) {
                ctx.fillStyle='#300'; ctx.fillRect(20,20,canvas.width-40,30);
                ctx.fillStyle='#f00'; ctx.fillRect(20,20,(canvas.width-40)*(boss.hp/boss.maxHp),30);
                ctx.strokeStyle='#fff'; ctx.strokeRect(20,20,canvas.width-40,30);
                ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText("THE WARDEN", canvas.width/2, 42);
            }

            if(player.glitchMeter>=player.glitchMax) UI.drawButton('OVERDRIVE', canvas.width-150, canvas.height-100, 130, 80, '#f0f', ()=>player.activateOverdrive());
            else { ctx.fillStyle='#333'; ctx.fillRect(canvas.width-150, canvas.height-40, 130, 20); ctx.fillStyle='#f0f'; ctx.fillRect(canvas.width-150, canvas.height-40, 130*(player.glitchMeter/player.glitchMax), 20); }

            if(GameData.settings.crtEffect) { ctx.fillStyle="rgba(0,0,0,0.1)"; for(let i=0;i<canvas.height;i+=4)ctx.fillRect(0,i,canvas.width,2); }
            UI.handleInput();
        }

        function drawEntity(e, c) {
            // Draw relative to Top-Left x,y (Visuals matched to hitbox)
            ctx.fillStyle=c; ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(e.x+e.w, e.y+4, 4, e.h); ctx.fillRect(e.x+4, e.y+e.h, e.w, 4);
        }
        function drawGem(g) { ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.moveTo(g.x+g.w/2, g.y); ctx.lineTo(g.x+g.w, g.y+g.h/2); ctx.lineTo(g.x+g.w/2, g.y+g.h); ctx.lineTo(g.x, g.y+g.h/2); ctx.fill(); }
        function drawProjectile(p) {
            ctx.fillStyle='#fff';
            if(p.type==='BOSS_ORB') { ctx.fillStyle='#f00'; ctx.beginPath(); ctx.arc(p.x+p.w/2, p.y+p.h/2, 8, 0, 6.28); ctx.fill(); } // Center circle in rect
            else if(p.type==='REALITY_TEAR') { ctx.fillStyle='#f0f'; ctx.globalAlpha=0.5; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.globalAlpha=1; }
            else if(p.type==='CORRUPT_CLOUD') { ctx.fillStyle='#0f0'; ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(p.x+p.w/2, p.y+p.h/2, 30, 0, 6.28); ctx.fill(); ctx.globalAlpha=1; }
            else if(p.type==='PIXEL_RAIL') { ctx.strokeStyle='#ff0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.tx, p.ty); ctx.stroke(); }
            else ctx.fillRect(p.x, p.y, p.w, p.h);
        }

        function startGame(charType) {
            score=0; gameTime=0; spawnTimer=0; waveTimer=0; bossSpawned=false; nemesisSpawned=false; endlessMode=false;
            player.init(charType);
            enemyPool.reset(); projectilePool.reset(); gemPool.reset(); particlePool.reset(); damageTextPool.reset();
            SceneManager.changeScene('PLAYING');
            lastTime=performance.now(); requestAnimationFrame(gameLoop);
        }

        function gameLoop(ts) {
            const dt = Math.min((ts - lastTime)/1000, 0.1); lastTime = ts;
            // Clear & Reset
            ctx.setTransform(1,0,0,1,0,0);
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);

            if(currentScene==='BOOT') {
                SceneManager.bootTimer+=dt; ctx.fillStyle='#0ff'; ctx.textAlign='center'; ctx.fillText("LOADING V8...", canvas.width/2, canvas.height/2);
                if(SceneManager.bootTimer>1) SceneManager.changeScene('TITLE');
            } else if(currentScene==='TITLE') {
                drawGridBackground(ts*0.05); ctx.fillStyle='#0ff'; ctx.font='80px VT323'; ctx.textAlign='center'; ctx.fillText("LOOMIVERS", canvas.width/2, 100);
                UI.drawButton('PLAY', canvas.width/2-100, 220, 200, 50, '#0a0', ()=>SceneManager.changeScene('HUB'));
                UI.drawButton('SETTINGS', canvas.width/2-100, 290, 200, 50, '#333', ()=>SceneManager.changeScene('SETTINGS'));
                UI.handleInput();
            } else if(currentScene==='HUB') {
                ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#0ff'; ctx.font='40px VT323'; ctx.textAlign='center'; ctx.fillText('THE SANCTUARY', canvas.width/2, 50);
                ctx.textAlign='left'; ctx.fillStyle='#ff0'; ctx.fillText(`FRAGMENTS: ${GameData.progress.currency}`, 20, 40);
                const cX=canvas.width/2-100;
                UI.drawButton('ENTER GLITCH', cX, 120, 200, 50, '#f0f', ()=>SceneManager.changeScene('CHARACTER_SELECT'));
                UI.drawButton('BLACKSMITH', cX, 190, 200, 50, '#333', ()=>SceneManager.changeScene('SHOP'));
                UI.drawButton('BACK', 20, canvas.height-70, 100, 50, '#555', ()=>SceneManager.changeScene('TITLE'));
                UI.handleInput();
            } else if(currentScene==='CHARACTER_SELECT') {
                ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText("SELECT CHARACTER", canvas.width/2, 50);
                const keys=Object.keys(CHARACTERS); const cols=5; const sx=100, sy=120, gx=150, gy=180;
                keys.forEach((k,i)=>{
                    const c=CHARACTERS[k], r=Math.floor(i/cols), col=i%cols, x=sx+col*gx, y=sy+r*gy, un=GameData.progress.unlockedChars.includes(k);
                    ctx.fillStyle='#222'; ctx.fillRect(x,y,130,160); ctx.strokeStyle=un?c.color:'#555'; ctx.strokeRect(x,y,130,160);
                    ctx.fillStyle=c.color; ctx.fillRect(x+45,y+20,40,40);
                    ctx.fillStyle='#fff'; ctx.font='20px VT323'; ctx.fillText(c.name, x+65, y+80);
                    ctx.fillStyle='#aaa'; ctx.font='16px VT323'; ctx.fillText(c.stat, x+65, y+100);
                    if(un) UI.drawButton("SELECT", x+15, y+120, 100, 30, '#0a0', ()=>startGame(k));
                    else if(GameData.progress.currency>=c.price) UI.drawButton(`${c.price}`, x+15, y+120, 100, 30, '#aa0', ()=>{GameData.progress.currency-=c.price; GameData.progress.unlockedChars.push(k); GameData.saveProgress();});
                    else { ctx.fillStyle='#500'; ctx.fillText("LOCKED", x+65, y+135); ctx.fillText(c.price, x+65, y+150); }
                });
                UI.drawButton("BACK", 20, canvas.height-70, 100, 50, '#555', ()=>SceneManager.changeScene('HUB'));
                UI.handleInput();
            } else if(currentScene==='SHOP') {
                ctx.fillStyle='#222'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('THE BLACKSMITH', canvas.width/2, 50);
                ctx.fillStyle='#ff0'; ctx.fillText(`FRAGMENTS: ${GameData.progress.currency}`, canvas.width/2, 80);
                const ups=[{id:'health',n:'MAX HP',d:'+10 HP'}, {id:'damage',n:'DAMAGE',d:'+5% DMG'}, {id:'magnet',n:'MAGNET',d:'+20 Range'}, {id:'greed',n:'GREED',d:'+10% Loot'}];
                let y=120;
                ups.forEach(u=>{
                    const l=GameData.progress.upgrades[u.id]||0, cost=(l+1)*200;
                    ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.fillText(`${u.n} (LVL ${l})`, canvas.width/2-200, y+25);
                    if(GameData.progress.currency>=cost) UI.drawButton(`BUY ${cost}`, canvas.width/2+100, y, 120, 40, '#0a0', ()=>{GameData.progress.currency-=cost; GameData.progress.upgrades[u.id]=(GameData.progress.upgrades[u.id]||0)+1; GameData.saveProgress();});
                    else { ctx.fillStyle='#333'; ctx.fillRect(canvas.width/2+100,y,120,40); ctx.fillStyle='#777'; ctx.fillText(cost, canvas.width/2+140, y+25); }
                    y+=70;
                });
                UI.drawButton("BACK", 20, canvas.height-70, 100, 50, '#555', ()=>SceneManager.changeScene('HUB'));
                UI.handleInput();
            } else if(currentScene==='PLAYING') {
                updateGame(dt); render();
            } else if(currentScene==='SETTINGS') {
                ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('SETTINGS', canvas.width/2, 50);
                const cx=canvas.width/2-150; let y=100, g=80;
                UI.drawSlider("MASTER VOLUME", GameData.settings.masterVolume, cx, y, 300, 30, v=>{GameData.settings.masterVolume=v; GameData.saveSettings();}); y+=g;
                UI.drawToggle("CRT EFFECT", GameData.settings.crtEffect, cx, y, 100, 40, v=>{GameData.settings.crtEffect=v; GameData.saveSettings();});
                UI.drawToggle("PARTICLES", GameData.settings.particles==='High', cx+150, y, 150, 40, v=>{GameData.settings.particles=v?'High':'Low'; GameData.saveSettings();}); y+=g;
                UI.drawSelector("SIDE", ['Left','Right'], GameData.settings.joystickSide, cx, y, 300, 40, v=>{GameData.settings.joystickSide=v; GameData.saveSettings();}); y+=g;
                UI.drawSelector("SIZE", ['Small','Medium','Large'], GameData.settings.joystickSize, cx, y, 300, 40, v=>{GameData.settings.joystickSize=v; GameData.saveSettings();}); y+=g;
                UI.drawToggle("DEBUG HITBOXES", GameData.settings.debugMode, cx, y, 300, 40, v=>{GameData.settings.debugMode=v; GameData.saveSettings();}); y+=g;
                UI.drawButton("RESET DATA", cx, y, 300, 50, '#500', ()=>{if(confirm("Reset?")){GameData.resetProgress(); SceneManager.changeScene('TITLE');}});
                UI.drawButton("BACK", 20, canvas.height-70, 100, 50, '#555', ()=>SceneManager.changeScene('TITLE'));
                UI.handleInput();
            } else if(currentScene==='PAUSED') {
                render(); ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                UI.drawButton('RESUME', canvas.width/2-100, 200, 200, 50, '#00f', ()=>SceneManager.changeScene('PLAYING'));
                UI.drawButton('QUIT', canvas.width/2-100, 270, 200, 50, '#f00', ()=>SceneManager.changeScene('HUB'));
                UI.handleInput();
            } else if(currentScene==='GAME_OVER') {
                render(); ctx.fillStyle='rgba(50,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#f00'; ctx.fillText("CRITICAL FAILURE", canvas.width/2, 150);
                ctx.fillStyle='#fff'; ctx.fillText(`SCORE: ${score}`, canvas.width/2, 200);
                UI.drawButton('HUB', canvas.width/2-100, 300, 200, 50, '#333', ()=>SceneManager.changeScene('HUB'));
                UI.handleInput();
            } else if(currentScene==='LEVEL_UP') {
                render(); ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#ff0'; ctx.fillText("LEVEL UP", canvas.width/2, 80);
                let y=150;
                upgradeChoices.forEach(c=>{
                    UI.drawButton(`${c.t} - ${c.d}`, canvas.width/2-200, y, 400, 60, '#222', ()=>selectUpgrade(c.id)); y+=80;
                });
                UI.handleInput();
            }
            input.clearTaps();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
