// --- UTILS ---
function deepMerge(defaults, saved) {
    const result = { ...defaults };
    for (const key in saved) {
        if (typeof saved[key] === 'object' && saved[key] !== null && !Array.isArray(saved[key]) && typeof defaults[key] === 'object') {
            result[key] = deepMerge(defaults[key], saved[key]);
        } else {
            result[key] = saved[key];
        }
    }
    return result;
}

const GameData = {
    progress: JSON.parse(JSON.stringify(DefaultGameData.progress)),
    settings: JSON.parse(JSON.stringify(DefaultGameData.settings)),

    saveProgress() {
        localStorage.setItem('loomivers_progress', JSON.stringify(this.progress));
    },

    saveSettings() {
        localStorage.setItem('loomivers_settings', JSON.stringify(this.settings));
    },

    load() {
        try {
            const prog = localStorage.getItem('loomivers_progress');
            if (prog) {
                this.progress = deepMerge(DefaultGameData.progress, JSON.parse(prog));
            }

            const set = localStorage.getItem('loomivers_settings');
            if (set) {
                this.settings = deepMerge(DefaultGameData.settings, JSON.parse(set));
            }
        } catch (e) {
            console.error("Save Data Corrupt, resetting to defaults", e);
        }
    },

    resetProgress() {
        this.progress = JSON.parse(JSON.stringify(DefaultGameData.progress));
        this.saveProgress();
    }
};

class ObjectPool {
    constructor(createFn, initialSize = 100) {
        this.createFn = createFn;
        this.pool = [];
        this.active = [];

        for (let i = 0; i < initialSize; i++) {
            this.pool.push(this.createFn());
        }
    }

    get() {
        let obj;
        if (this.pool.length > 0) {
            obj = this.pool.pop();
        } else {
            obj = this.createFn();
        }
        obj.active = true;
        this.active.push(obj);
        return obj;
    }

    release(obj) {
        const index = this.active.indexOf(obj);
        if (index > -1) {
            this.active.splice(index, 1);
            obj.active = false;
            this.pool.push(obj);
        }
    }

    reset() {
        while(this.active.length > 0) {
            const obj = this.active.pop();
            obj.active = false;
            this.pool.push(obj);
        }
    }
}

function checkRectCollide(r1, r2) {
    return (r1.x < r2.x + r2.width &&
            r1.x + r1.width > r2.x &&
            r1.y < r2.y + r2.height &&
            r1.y + r1.height > r2.y);
}

class World {
    constructor() {
        this.chunkSize = 512; // 8x8 tiles of 64px
        this.tileSize = 64;
        this.chunks = new Map(); // key: "x,y", value: ChunkData
        this.images = {};
        this.loaded = false;
        this.seed = Math.random() * 10000;
        this.staticObjects = []; // We will fill this dynamically
    }

    async load() {
        const promises = Object.keys(ASSETS_DATA).map(key => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    this.images[key] = img;
                    resolve();
                };
                img.onerror = reject;
                img.src = ASSETS_DATA[key];
            });
        });
        await Promise.all(promises);
        this.loaded = true;
    }

    reset() {
        this.chunks.clear();
        this.staticObjects = [];
        this.seed = Math.random() * 10000;
    }

    // Pseudo-random number generator
    random(x, y) {
        const dot = x * 12.9898 + y * 78.233 + this.seed;
        return (Math.sin(dot) * 43758.5453) % 1;
    }

    noise(x, y) {
        return (Math.sin(x * 0.1 + this.seed) + Math.cos(y * 0.1 + this.seed)) * 0.5 + 0.5;
    }

    getChunk(cx, cy) {
        const key = `${cx},${cy}`;
        if (this.chunks.has(key)) {
            return this.chunks.get(key);
        }

        const chunk = {
            tiles: [],
            objects: []
        };

        const tilesPerChunk = this.chunkSize / this.tileSize;
        const startX = cx * tilesPerChunk;
        const startY = cy * tilesPerChunk;

        for (let y = 0; y < tilesPerChunk; y++) {
            const row = [];
            for (let x = 0; x < tilesPerChunk; x++) {
                const wx = startX + x;
                const wy = startY + y;

                // Map generated keys to standard keys in world.js or update keys here
                // process_sprites produces TILE_GRASS1, TILE_PATH1 etc.
                let tileType = 'TILE_GRASS1';
                if (Math.abs(this.random(wx, wy)) > 0.7) tileType = 'TILE_GRASS2';

                // Path generation
                const n = this.noise(wx, wy);
                if (n > 0.7) {
                    tileType = 'TILE_PATH1';
                    if (Math.abs(this.random(wx, wy * 2)) > 0.5) tileType = 'TILE_PATH2';
                } else if (n > 0.6) {
                    tileType = 'TILE_PATH_FLOOR';
                }

                row.push(tileType);

                // Decor / Obstacles
                if (!tileType.includes('PATH')) {
                    const r = Math.abs(this.random(wx * 3, wy * 3));
                    const treeNoise = (Math.sin(wx * 0.3) + Math.cos(wy * 0.4));

                    const objX = (wx * this.tileSize) + 16 + (Math.abs(this.random(wx, wy)) * 10 - 5);
                    const objY = (wy * this.tileSize) + 16 + (Math.abs(this.random(wy, wx)) * 10 - 5);

                    if (treeNoise > 0.5 && r > 0.7) {
                        chunk.objects.push({
                            type: 'TREE',
                            x: objX,
                            y: objY
                        });
                    } else if (r > 0.95) {
                        chunk.objects.push({
                            type: 'BUSH',
                            x: objX,
                            y: objY
                        });
                    }
                }
            }
            chunk.tiles.push(row);
        }

        this.chunks.set(key, chunk);
        return chunk;
    }

    // Get static objects visible in the camera view for collision
    // This needs to be called by game loop to update staticObjects array
    updateStaticObjects(cameraX, cameraY, width, height) {
        // Clear current static objects as we will repopulate from visible chunks
        // Actually, for collision we need a specific area.
        // We can return a list of objects.

        const startX = -cameraX;
        const startY = -cameraY;

        const startChunkX = Math.floor(startX / this.chunkSize);
        const startChunkY = Math.floor(startY / this.chunkSize);
        // Strict buffer for "2 chunks around" requirement based on screen size
        // We calculate visible range and add a small buffer (1 chunk).
        const endChunkX = Math.floor((startX + width) / this.chunkSize) + 1;
        const endChunkY = Math.floor((startY + height) / this.chunkSize) + 1;

        const objects = [];

        // Automatic screen size verification is implicit in 'width' and 'height' parameters passed from game loop.
        // We only keep chunks within the visible area + buffer.

        const keepKeys = new Set();

        // Iterate visible range + 1 buffer
        for (let cy = startChunkY - 1; cy <= endChunkY + 1; cy++) {
            for (let cx = startChunkX - 1; cx <= endChunkX + 1; cx++) {
                const chunk = this.getChunk(cx, cy);
                objects.push(...chunk.objects);
                keepKeys.add(`${cx},${cy}`);
            }
        }

        // Garbage collection for chunks
        for (const key of this.chunks.keys()) {
            if (!keepKeys.has(key)) {
                this.chunks.delete(key);
            }
        }

        return objects;
    }

    render(ctx, cameraX, cameraY, canvasWidth, canvasHeight) {
        if (!this.loaded) return;

        const startX = -cameraX;
        const startY = -cameraY;

        const startChunkX = Math.floor(startX / this.chunkSize);
        const startChunkY = Math.floor(startY / this.chunkSize);

        const endChunkX = Math.floor((startX + canvasWidth) / this.chunkSize) + 1;
        const endChunkY = Math.floor((startY + canvasHeight) / this.chunkSize) + 1;

        for (let cy = startChunkY; cy <= endChunkY; cy++) {
            for (let cx = startChunkX; cx <= endChunkX; cx++) {
                const chunk = this.getChunk(cx, cy);
                const tilesPerChunk = this.chunkSize / this.tileSize;

                for (let y = 0; y < tilesPerChunk; y++) {
                    for (let x = 0; x < tilesPerChunk; x++) {
                        const tile = chunk.tiles[y][x];
                        if (this.images[tile]) {
                            const drawX = (cx * this.chunkSize) + (x * this.tileSize);
                            const drawY = (cy * this.chunkSize) + (y * this.tileSize);

                            // Optimization: Check if tile is visible?
                            // Canvas drawImage is pretty fast with culling, but let's check basic bounds
                            if (drawX + this.tileSize > startX && drawX < startX + canvasWidth &&
                                drawY + this.tileSize > startY && drawY < startY + canvasHeight) {
                                ctx.drawImage(this.images[tile],
                                    Math.floor(drawX),
                                    Math.floor(drawY),
                                    this.tileSize + 1,
                                    this.tileSize + 1
                                );
                            }
                        }
                    }
                }
            }
        }
    }
}

class AudioController {
    constructor() {
        this.initialized = false;
        this.audioCtx = null;
        this.bgmOsc = null;
        this.bgmGain = null;
        this.bgmLfo = null;
        this.isBossMode = false;
    }

    init() {
        if (this.initialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            this.audioCtx = new AudioContext();

            // Create a buffer and play it to unlock audio on iOS
            const buffer = this.audioCtx.createBuffer(1, 1, 22050);
            const source = this.audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(this.audioCtx.destination);
            source.start(0);

            if (this.audioCtx.state === 'suspended') {
                this.audioCtx.resume();
            }
            this.initialized = true;
            this.playBgm();
        } catch (e) {
            console.warn("AudioContext init failed", e);
        }
    }

    playBgm() {
        if (!this.audioCtx) return;

        const vol = GameData.settings.masterVolume;
        if (vol <= 0) return;

        // Base Drone
        this.bgmOsc = this.audioCtx.createOscillator();
        this.bgmGain = this.audioCtx.createGain();
        this.bgmOsc.type = 'sawtooth'; // Grittier sound
        this.bgmOsc.frequency.value = 55; // A1 (Low Drone)

        // Low Pass Filter for that "muffled" space sound
        this.bgmFilter = this.audioCtx.createBiquadFilter();
        this.bgmFilter.type = 'lowpass';
        this.bgmFilter.frequency.value = 400;

        // LFO for movement
        this.bgmLfo = this.audioCtx.createOscillator();
        this.bgmLfoGain = this.audioCtx.createGain();
        this.bgmLfo.frequency.value = 0.2; // Slow pulse
        this.bgmLfoGain.gain.value = 100;

        // Connections
        this.bgmLfo.connect(this.bgmLfoGain);
        this.bgmLfoGain.connect(this.bgmFilter.frequency); // Modulate filter cutoff

        this.bgmOsc.connect(this.bgmFilter);
        this.bgmFilter.connect(this.bgmGain);
        this.bgmGain.connect(this.audioCtx.destination);

        this.bgmGain.gain.setValueAtTime(0.05 * vol, this.audioCtx.currentTime);

        this.bgmOsc.start();
        this.bgmLfo.start();
    }

    setBossMode(active) {
        if (!this.initialized || !this.bgmOsc) return;
        this.isBossMode = active;
        const now = this.audioCtx.currentTime;

        if (active) {
            // Boss Mode: Faster, higher pitch, more intense
            this.bgmOsc.frequency.linearRampToValueAtTime(110, now + 2); // A2
            this.bgmLfo.frequency.linearRampToValueAtTime(4.0, now + 2); // Fast pulse
            this.bgmGain.gain.linearRampToValueAtTime(0.08 * GameData.settings.masterVolume, now + 2);
        } else {
            // Normal Mode: Slow, deep
            this.bgmOsc.frequency.linearRampToValueAtTime(55, now + 2); // A1
            this.bgmLfo.frequency.linearRampToValueAtTime(0.2, now + 2); // Slow pulse
            this.bgmGain.gain.linearRampToValueAtTime(0.05 * GameData.settings.masterVolume, now + 2);
        }
    }

    playPing() {
        if (!this.initialized || !this.audioCtx) return;
        const vol = GameData.settings.masterVolume;
        if (vol <= 0) return;

        try {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, this.audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.1 * vol, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(this.audioCtx.destination);

            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.1);
        } catch(e) { console.warn("playPing error", e); }
    }

    playCrunch() {
        if (!this.initialized || !this.audioCtx) return;
        const vol = GameData.settings.masterVolume;
        if (vol <= 0) return;

        try {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, this.audioCtx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.1 * vol, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(this.audioCtx.destination);

            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.2);
        } catch(e) { console.warn("playCrunch error", e); }
    }

    playLevelUp() {
        if (!this.initialized || !this.audioCtx) return;
        const vol = GameData.settings.masterVolume;
        if (vol <= 0) return;

        try {
            const now = this.audioCtx.currentTime;
            [440, 554, 659, 880].forEach((freq, i) => {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();

                osc.type = 'square';
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0.1 * vol, now + i * 0.1);
                gain.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.1);

                osc.connect(gain);
                gain.connect(this.audioCtx.destination);

                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.1);
            });
        } catch(e) { console.warn("playLevelUp error", e); }
    }
}

const UI = {
    buttons: [],
    sliders: [],

    drawButton(ctx, text, x, y, w, h, color, action) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x + w/2, y + h/2);

        this.buttons.push({ x, y, w, h, action });
    },

    drawSlider(ctx, label, value, x, y, w, h, onChange) {
        ctx.fillStyle = '#333';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = '#0f0';
        ctx.fillRect(x, y, w * value, h);

        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${label}: ${Math.round(value*100)}%`, x, y - 15);

        this.sliders.push({ x, y, w, h, onChange });
    },

    drawSelector(ctx, label, options, currentValue, x, y, w, h, onChange) {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(label, x, y - 15);

        const optW = w / options.length;
        options.forEach((opt, i) => {
            const optX = x + (i * optW);
            const isSelected = opt === currentValue;

            ctx.fillStyle = isSelected ? '#0a0' : '#333';
            ctx.fillRect(optX, y, optW, h);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(optX, y, optW, h);

            ctx.fillStyle = isSelected ? '#fff' : '#aaa';
            ctx.textAlign = 'center';
            ctx.fillText(opt, optX + optW/2, y + h/2);

            this.buttons.push({ x: optX, y, w: optW, h, action: () => onChange(opt) });
        });
    },

    drawToggle(ctx, label, value, x, y, w, h, onToggle) {
        this.drawSelector(ctx, label, ['OFF', 'ON'], value ? 'ON' : 'OFF', x, y, w, h, (val) => onToggle(val === 'ON'));
    },

    registerArea(x, y, w, h, action) {
        this.buttons.push({ x, y, w, h, action });
    },

    handleInput(input) {
        for (const btn of this.buttons) {
            if (input.checkTap(btn)) {
                audioController.playPing();
                btn.action();
            }
        }
        for (const sld of this.sliders) {
            const touches = input.taps;
            for (const t of touches) {
                if (t.x >= sld.x && t.x <= sld.x + sld.w && t.y >= sld.y && t.y <= sld.y + sld.h) {
                    const val = Math.max(0, Math.min(1, (t.x - sld.x) / sld.w));
                    sld.onChange(val);
                }
            }
        }
        this.buttons = [];
        this.sliders = [];
    }
};

// STATIC OBJECT
class StaticObject {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.width = 64;
        this.height = 64;
        this.solid = false;

        if (type === 'TREE') {
            // Trees are obstacles
            this.solid = true;
            // Collision box is smaller (trunk)
            this.colOffsetX = 20;
            this.colOffsetY = 40;
            this.colW = 24;
            this.colH = 20;
        } else {
            // Bushes etc
            this.colOffsetX = 10;
            this.colOffsetY = 10;
            this.colW = 44;
            this.colH = 44;
        }
    }
}
const staticObjects = [];

// PLAYER
class Player {
    constructor() {
        this.x = 0;
        this.y = 0;
        this.width = 20;
        this.height = 20;
        this.speed = 200;
        this.hp = 100;
        this.maxHp = 100;
        this.xp = 0;
        this.nextLevelXp = 10;
        this.level = 1;
        this.weapons = []; // Array of weapon config objects
        this.passives = []; // Array of {id, level}
        this.drones = []; // Array of Drone objects
        this.iframeTimer = 0;
        this.color = '#0ff';
        this.damageMult = 1.0;
        this.fireRateMult = 1.0;

        // Animation
        this.animTimer = 0;
        this.isMoving = false;
        this.facingRight = true;
        this.frameIndex = 1; // 1-3 for walking
        this.state = 'STAND';

        // Overdrive
        this.glitchMeter = 0;
        this.glitchMax = 100;
        this.overdriveActive = false;
        this.overdriveTimer = 0;

        // Init with Neon Wand
        this.addWeapon('NEON_WAND');
    }

    reset(selectedCharacter) {
        const charConfig = CHARACTERS[selectedCharacter] || CHARACTERS.WEAVER;

        // Apply Permanent Upgrades + Character Stats
        this.maxHp = 100 + (GameData.progress.upgrades.health * 10) + (charConfig.hpBonus || 0);
        this.damageMult = 1.0 + (GameData.progress.upgrades.damage * 0.05) + (charConfig.dmgBonus || 0);
        const magnetRange = 100 + (GameData.progress.upgrades.magnet * 20);

        this.x = WORLD_WIDTH / 2; // Center of world
        this.y = WORLD_HEIGHT / 2;
        this.hp = this.maxHp;
        this.speed = 200 + (charConfig.speedBonus || 0);
        this.xp = 0;
        this.nextLevelXp = 10;
        this.level = 1;
        this.iframeTimer = 0;
        this.weapons = [];
        this.passives = [];
        this.drones = [];
        this.fireRateMult = 1.0;

        this.glitchMeter = 0;
        this.overdriveActive = false;

        // Skin Colors
        this.color = charConfig.color;

        this.addWeapon(charConfig.weapon);
    }

    activateOverdrive() {
        if (this.glitchMeter >= this.glitchMax && !this.overdriveActive) {
            this.overdriveActive = true;
            this.overdriveTimer = 5.0;
            this.glitchMeter = 0;
            sceneManager.addShake(20);
        }
    }

    addPassive(id) {
        const existing = this.passives.find(p => p.id === id);
        if (existing) existing.level++;
        else this.passives.push({ id: id, level: 1 });

        // Apply Passive Effects
        if (id === 'MIGHT') this.damageMult += 0.1;
        else if (id === 'HASTE') this.fireRateMult *= 0.9;
        else if (id === 'SPEED') this.speed += 20;
        else if (id === 'ARMOR') this.maxHp += 20; this.hp += 20;
        else if (id === 'CURSED_HEART') { this.maxHp -= 50; this.damageMult += 0.5; this.hp = Math.min(this.hp, this.maxHp); }
        else if (id === 'GLASS_CANNON') { this.maxHp = 1; this.damageMult += 1.0; this.hp = 1; }
    }

    addDrone() {
        this.drones.push(new Drone(this.drones.length));
    }

    addWeapon(type) {
        const weaponConfig = {
            type: type,
            cooldown: 0,
            level: 1,
            evolved: false
        };

        if (type === 'NEON_WAND') {
            weaponConfig.fireRate = 0.5;
            weaponConfig.damage = 10;
        } else if (type === 'DATA_ORBIT') {
            weaponConfig.fireRate = 0;
            weaponConfig.damage = 5;
            weaponConfig.angle = 0;
        } else if (type === 'GLITCH_BOMB') {
            weaponConfig.fireRate = 2.0;
            weaponConfig.damage = 30;
        } else if (type === 'PIXEL_RAIL') {
            weaponConfig.fireRate = 1.5; weaponConfig.damage = 50;
        } else if (type === 'VOID_AXE') {
            weaponConfig.fireRate = 1.0; weaponConfig.damage = 60;
        } else if (type === 'FORCE_FIELD') {
            weaponConfig.fireRate = 2.0; weaponConfig.damage = 15;
        }

        this.weapons.push(weaponConfig);
    }

    update(dt, input) {
        let speedMult = 1.0;
        let fireRateMult = 1.0;

        if (this.overdriveActive) {
            this.overdriveTimer -= dt;
            speedMult = 2.0;
            fireRateMult = 2.0;
            this.iframeTimer = 0.1;

            if (this.overdriveTimer <= 0) {
                this.overdriveActive = false;
                sceneManager.increaseCorruption();
            }
        }

        const moveVec = input.getMovementVector();

        this.isMoving = moveVec.x !== 0 || moveVec.y !== 0;
        if (moveVec.x !== 0) {
            this.facingRight = moveVec.x > 0;
        }

        // Animation Update
        this.animTimer += dt;
        if (this.isMoving) {
            this.state = 'WALK';
            if (this.animTimer > 0.15) {
                this.animTimer = 0;
                this.frameIndex++;
                if (this.frameIndex > 3) this.frameIndex = 1;
            }
        } else {
            this.state = 'STAND';
            this.frameIndex = 1;
        }

        // Move X
        this.x += moveVec.x * this.speed * speedMult * dt;
        // Infinite World: No clamping

        // Collision X
        if (moveVec.x !== 0) {
            for (const obj of staticObjects) {
                if (obj.solid) {
                    if (checkRectCollide(this, {x: obj.x + obj.colOffsetX, y: obj.y + obj.colOffsetY, width: obj.colW, height: obj.colH})) {
                        if (moveVec.x > 0) this.x = obj.x + obj.colOffsetX - this.width;
                        else this.x = obj.x + obj.colOffsetX + obj.colW;
                    }
                }
            }
        }

        // Move Y
        this.y += moveVec.y * this.speed * speedMult * dt;
        // Infinite World: No clamping

        // Collision Y
        if (moveVec.y !== 0) {
            for (const obj of staticObjects) {
                if (obj.solid) {
                    if (checkRectCollide(this, {x: obj.x + obj.colOffsetX, y: obj.y + obj.colOffsetY, width: obj.colW, height: obj.colH})) {
                        if (moveVec.y > 0) this.y = obj.y + obj.colOffsetY - this.height;
                        else this.y = obj.y + obj.colOffsetY + obj.colH;
                    }
                }
            }
        }

        if (this.iframeTimer > 0) {
            this.iframeTimer -= dt;
        }

        this.weapons.forEach(w => {
            if (w.type === 'DATA_ORBIT') {
                w.angle += 3 * dt * fireRateMult;
            } else if (w.type === 'STORM_ORBIT') {
                w.angle += 8 * dt * fireRateMult; // Much faster
            } else {
                w.cooldown -= dt * fireRateMult;
                if (w.cooldown <= 0) {
                    this.fireWeapon(w);
                }
            }
        });

        this.drones.forEach(d => d.update(dt, this));
    }

    fireWeapon(w) {
        // Will be wired in game.js via callback or event,
        // OR we export a global function. V5 used global.
        // We'll export a function `fireWeaponGlobal` from here that needs context.
        // Actually, entities shouldn't depend on game.js loop context directly.
        // But for strict fractioning, we need to replicate V5 structure.
        if (window.fireWeaponGlobal) window.fireWeaponGlobal(this, w);
    }

    takeDamage(amount) {
        if (this.iframeTimer > 0) return;
        this.hp -= amount;
        this.iframeTimer = 0.5;

        if (this.hp <= 0) {
            sceneManager.endGame();
        }
    }

    gainXp(amount) {
        this.xp += amount;
        audioController.playPing();
        if (this.xp >= this.nextLevelXp) {
            this.levelUp();
        }
    }

    levelUp() {
        this.xp -= this.nextLevelXp;
        this.level++;
        this.nextLevelXp = Math.floor(this.nextLevelXp * 1.5);
        audioController.playLevelUp();
        sceneManager.triggerLevelUpScreen();
    }
}

// ENEMY
class Enemy {
    constructor() {
        this.active = false;
        this.x = 0; this.y = 0;
        this.width = 20; this.height = 20;
        this.hp = 10; this.maxHp = 10;
        this.speed = 50;
        this.type = 'SWARMER';
        this.color = '#f00';
        this.knockbackX = 0; this.knockbackY = 0;
        this.attackTimer = 0;

        // Anim
        this.animTimer = 0;
        this.frameIndex = 1;
        this.state = 'STAND';
        this.facingRight = true;
    }

    init(type, x, y) {
        this.active = true;
        this.x = x; this.y = y;
        this.type = type;
        this.knockbackX = 0; this.knockbackY = 0;
        this.flashTimer = 0; this.attackTimer = 0;
        this.frameIndex = 1;
        this.state = 'WALK'; // Default state for enemies

        if (type === 'SWARMER') {
            this.width = 15; this.height = 15;
            this.hp = 10 + (player.level * 2);
            this.speed = 80 + (player.level * 2);
            this.color = '#f00';
        } else if (type === 'TANK') {
            this.width = 30; this.height = 30;
            this.hp = 50 + (player.level * 10);
            this.speed = 40;
            this.color = '#900';
        } else if (type === 'GLITCH_MITE') {
            this.width = 12; this.height = 12;
            this.hp = 5 + (player.level * 1);
            this.speed = 120;
            this.color = '#ff0';
        } else if (type === 'WARDEN') {
            this.width = 60; this.height = 60;
            this.hp = 5000 + (player.level * 100);
            this.maxHp = this.hp;
            this.speed = 60;
            this.color = '#f0f';
        }
    }

    update(dt) {
        if (!this.active) return;
        if (this.flashTimer > 0) this.flashTimer -= dt;

        if (Math.abs(this.knockbackX) > 1 || Math.abs(this.knockbackY) > 1) {
            this.x += this.knockbackX * dt;
            this.y += this.knockbackY * dt;
            this.knockbackX *= 0.9;
            this.knockbackY *= 0.9;
        } else {
            let sepX = 0, sepY = 0;
            if (this.type !== 'WARDEN') {
                let checks = 0;
                for (const other of enemyPool.active) {
                    if (checks > 10) break;
                    if (other === this || other.type === 'WARDEN') continue;
                    const dx = this.x - other.x;
                    const dy = this.y - other.y;
                    if (Math.abs(dx) > 30 || Math.abs(dy) > 30) continue;
                    const distSq = dx*dx + dy*dy;
                    if (distSq < 900 && distSq > 0) {
                         const dist = Math.sqrt(distSq);
                         const force = (30 - dist) / 30;
                         sepX += (dx / dist) * force * 100;
                         sepY += (dy / dist) * force * 100;
                         checks++;
                    }
                }
            }

            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            let moveX = 0, moveY = 0;
            if (dist > 0) { moveX = (dx / dist) * this.speed; moveY = (dy / dist) * this.speed; }

            // Static Collision for enemies (Simple resolve)
            // Predict movement
            const nextX = this.x + (moveX + sepX) * dt;
            const nextY = this.y + (moveY + sepY) * dt;

            let hit = false;
            for (const obj of staticObjects) {
                if (obj.solid) {
                    if (checkRectCollide({x: nextX, y: nextY, width: this.width, height: this.height},
                        {x: obj.x + obj.colOffsetX, y: obj.y + obj.colOffsetY, width: obj.colW, height: obj.colH})) {
                        hit = true;
                        break;
                    }
                }
            }
            // If hit tree, just slide or stop? Simplest is to not move or slide.
            // Let's just reduce speed or slide.
            // Split axis for enemies too? Maybe too expensive for 200 enemies.
            // Let's just block them if they hit a tree.
            if (hit) {
                // Try sliding X
                 if (!checkRectCollide({x: nextX, y: this.y, width: this.width, height: this.height},
                        {x: 0, y: 0, width: 0, height: 0})) { // Hacky check? No.
                    // Just basic avoidance:
                    moveX = -moveY; moveY = moveX; // Turn 90 deg?
                 }
                 // Simple: Don't move into wall
                 // Actually, swarmers should probably just flow around.
                 // Let's skip static collision for small enemies for performance/gameplay flow?
                 // User said "trees should be obstacle". Usually applies to player.
                 // If enemies clip through trees it looks bad.
                 // Let's apply a soft push force away from trees.
            }

            // Re-implement soft collision with trees
             for (const obj of staticObjects) {
                if (obj.solid) {
                    // Check dist to center of tree base
                    const treeCx = obj.x + obj.colOffsetX + obj.colW/2;
                    const treeCy = obj.y + obj.colOffsetY + obj.colH/2;
                    const eCx = this.x + this.width/2;
                    const eCy = this.y + this.height/2;
                    const ddx = eCx - treeCx;
                    const ddy = eCy - treeCy;
                    const d2 = ddx*ddx + ddy*ddy;
                    const rad = (obj.colW/2 + this.width/2);
                    if (d2 < rad*rad) {
                        const d = Math.sqrt(d2) || 1;
                        sepX += (ddx/d) * 200; // Strong push out
                        sepY += (ddy/d) * 200;
                    }
                }
            }

            // Animation Update for Enemies
            this.animTimer += dt;
            if (this.animTimer > 0.2) {
                this.animTimer = 0;
                this.frameIndex++;
                if (this.frameIndex > 3) this.frameIndex = 1;
            }
            if (moveX > 0) this.facingRight = true;
            else if (moveX < 0) this.facingRight = false;


            if (this.type === 'WARDEN') {
                this.attackTimer += dt;
                const attackRate = (this.hp < this.maxHp * 0.5) ? 1.0 : 2.0;
                if (this.attackTimer > attackRate) {
                    this.attackTimer = 0;
                    // Trigger Attack Animation state here if we had logic for it
                    for (let i = -1; i <= 1; i++) {
                        projectilePool.get().init('BOSS_ORB', this.x + this.width/2, this.y + this.height/2, player.x + (i*50), player.y + (i*50), 20, true);
                    }
                    audioController.playCrunch();
                }
            } else if (this.type === 'TANK') {
                 if (Math.random() < 0.05) spawnParticle(this.x + this.width/2, this.y + this.height/2, '#500');
            }
            this.x += (moveX + sepX) * dt;
            this.y += (moveY + sepY) * dt;
        }
    }

    takeDamage(amount, knockbackForce = 0, sourceX, sourceY, isCrit = false) {
        this.hp -= amount;
        this.flashTimer = 0.1;
        if (knockbackForce > 0) {
            const dx = this.x - sourceX;
            const dy = this.y - sourceY;
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            this.knockbackX = (dx/dist) * knockbackForce;
            this.knockbackY = (dy/dist) * knockbackForce;
        }
        spawnDamageText(amount, this.x, this.y, isCrit);
        if (this.hp <= 0) this.die();
    }

    die() {
        this.active = false;
        audioController.playCrunch();
        enemyPool.release(this);

        if (Math.random() < 0.1) spawnGem(this.x, this.y, 10, true);
        else spawnGem(this.x, this.y, this.type === 'TANK' ? 5 : 1, false);

        if (player.glitchMeter < player.glitchMax) player.glitchMeter++;

        const pCount = GameData.settings.particles === 'High' ? 5 : 2;
        for(let i=0; i<pCount; i++) spawnParticle(this.x, this.y, this.color);
        sceneManager.addScore(this.type === 'TANK' ? 50 : 10);
        if(sceneManager.recordKill) sceneManager.recordKill(this.type);

        if (this.type === 'WARDEN') {
            sceneManager.onBossDeath();
        }

        if (this.isNemesis) {
            player.gainXp(100);
            GameData.progress.nemesis = null;
            GameData.saveProgress();
            spawnDamageText("NEMESIS DEFEATED!", this.x, this.y - 30);
        }
    }
}

const enemyPool = new ObjectPool(() => new Enemy(), 200);

// PROJECTILE
class Projectile {
    constructor() {
        this.active = false;
        this.x = 0; this.y = 0;
        this.vx = 0; this.vy = 0;
        this.width = 10; this.height = 10;
        this.damage = 10;
        this.duration = 2;
        this.type = 'NEON_WAND';
        this.penetrate = false;
        this.isEnemy = false;
    }

    init(type, x, y, targetX, targetY, damage, isEnemy = false) {
        this.active = true;
        this.type = type;
        this.x = x; this.y = y;
        this.damage = damage;
        this.duration = 3;
        this.penetrate = false;
        this.isEnemy = isEnemy;

        // Default Aim Vector
        const dx = targetX - x;
        const dy = targetY - y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        const dirX = dx/dist;
        const dirY = dy/dist;

        if (type === 'NEON_WAND') {
            this.width = 8; this.height = 8;
            const speed = 400;
            this.vx = dirX * speed; this.vy = dirY * speed;
        } else if (type === 'HOLY_BEAM') {
            this.width = 12; this.height = 12;
            const speed = 600;
            this.vx = dirX * speed; this.vy = dirY * speed;
            this.penetrate = true; // Penetrates enemies
            this.duration = 2.0;
        } else if (type === 'GLITCH_BOMB' || type === 'CLUSTER_BOMB') {
            this.width = 16; this.height = 16;
            const speed = 200;
            this.vx = dirX * speed; this.vy = dirY * speed;
        } else if (type === 'PIXEL_RAIL') {
            this.width = 4; this.height = 4;
            const speed = 800;
            this.vx = dirX * speed; this.vy = dirY * speed;
            this.penetrate = true;
            this.duration = 1.0;
        } else if (type === 'VOID_AXE') {
            this.width = 40; this.height = 40;
            const speed = 250;
            this.vx = dirX * speed; this.vy = dirY * speed;
            this.duration = 1.5;
            this.penetrate = true;
        } else if (type === 'FORCE_FIELD') {
            this.width = 60; this.height = 60;
            const speed = 100;
            this.vx = dirX * speed; this.vy = dirY * speed;
            this.penetrate = true;
        } else if (type === 'BOSS_ORB') {
            this.width = 15; this.height = 15;
            const speed = 150;
            this.vx = dirX * speed; this.vy = dirY * speed;
            this.duration = 5;
        }
    }

    update(dt) {
        if (!this.active) return;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.duration -= dt;
        if (this.duration <= 0) projectilePool.release(this);
    }
}

const projectilePool = new ObjectPool(() => new Projectile(), 100);

// GEM
class Gem {
    constructor() { this.active = false; }
    init(x, y, value, isData = false) {
        this.active = true; this.x = x; this.y = y; this.value = value; this.isData = isData;
        this.width = isData ? 12 : 8; this.height = isData ? 12 : 8;
    }
}
const gemPool = new ObjectPool(() => new Gem(), 200);

// PARTICLE
class Particle {
    constructor() { this.active = false; }
    init(x, y, color) {
        this.active = true; this.x = x; this.y = y; this.color = color;
        this.life = 0.5 + Math.random() * 0.5;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 200 + 50;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
    }
    update(dt) {
        if (!this.active) return;
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.vx *= 0.95; this.vy *= 0.95;
        this.life -= dt;
        if (this.life <= 0) particlePool.release(this);
    }
}
const particlePool = new ObjectPool(() => new Particle(), 200);

// DAMAGE TEXT
class DamageText {
    constructor() { this.active = false; }
    init(amount, x, y, isCrit = false) {
        this.active = true; this.x = x; this.y = y;
        this.text = typeof amount === 'number' ? Math.floor(amount) : amount;
        this.life = 0.8;
        this.vx = (Math.random() - 0.5) * 20;
        this.isCrit = isCrit;
        this.fontSize = isCrit ? 40 : 30;
        this.color = isCrit ? '#f00' : '#fff';
    }
    update(dt) {
        if (!this.active) return;
        this.y -= 50 * dt; this.x += this.vx * dt;
        this.life -= dt;
        if (this.life <= 0) damageTextPool.release(this);
    }
}
const damageTextPool = new ObjectPool(() => new DamageText(), 50);

// HELPERS
function spawnGem(x, y, value, isData = false) { gemPool.get().init(x, y, value, isData); }
function spawnParticle(x, y, color) { particlePool.get().init(x, y, color); }
function spawnDamageText(amount, x, y, isCrit = false) { damageTextPool.get().init(amount, x, y, isCrit); }

// DRONE COMPANION
class Drone {
    constructor(index) {
        this.index = index;
        this.angle = (index * Math.PI * 2) / 3; // Spread out if multiple
        this.distance = 50;
        this.cooldown = 0;
        this.fireRate = 1.0;
        this.x = 0;
        this.y = 0;
    }

    update(dt, player) {
        this.angle += dt;
        this.x = player.x + player.width/2 + Math.cos(this.angle) * this.distance - 4;
        this.y = player.y + player.height/2 + Math.sin(this.angle) * this.distance - 4;

        this.cooldown -= dt;
        if (this.cooldown <= 0) {
            // Auto fire weak shot
            let nearest = null, minDist = 300;
            for (const e of enemyPool.active) {
                const d = Math.sqrt((e.x-this.x)**2 + (e.y-this.y)**2);
                if (d < minDist) { minDist = d; nearest = e; }
            }
            if (nearest) {
                projectilePool.get().init('NEON_WAND', this.x, this.y, nearest.x+nearest.width/2, nearest.y+nearest.height/2, 5);
                this.cooldown = this.fireRate;
            }
        }
    }
}

// Input Handler
class InputHandler {
    constructor() {
        this.joystick = { x: 0, y: 0, active: false, originX: 0, originY: 0 };
        this.keys = {};
        this.taps = [];
        this.lastTouchTime = 0;
        this.setupTouch();
        this.setupKeyboard();
    }

    setupTouch() {
        document.addEventListener('touchstart', (e) => {
            this.lastTouchTime = Date.now();
            const touch = e.changedTouches[0];
            if (currentScene !== 'PLAYING') {
                this.taps.push({ x: touch.clientX, y: touch.clientY });
                return;
            }
            if (this.isValidJoystickZone(touch.clientX, window.innerWidth)) {
                this.joystick.active = true;
                this.joystick.originX = touch.clientX;
                this.joystick.originY = touch.clientY;
                this.joystick.x = 0;
                this.joystick.y = 0;
            }
            this.taps.push({ x: touch.clientX, y: touch.clientY });
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (currentScene !== 'PLAYING' || !this.joystick.active) return;
            e.preventDefault();
            const touch = e.changedTouches[0];
            const dx = touch.clientX - this.joystick.originX;
            const dy = touch.clientY - this.joystick.originY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            let size = 50;
            if (GameData.settings.joystickSize === 'Small') size = 30;
            if (GameData.settings.joystickSize === 'Large') size = 70;
            const maxRadius = size;
            if (distance > 0) {
                const angle = Math.atan2(dy, dx);
                const clampedDist = Math.min(distance, maxRadius);
                this.joystick.x = (Math.cos(angle) * clampedDist) / maxRadius;
                this.joystick.y = (Math.sin(angle) * clampedDist) / maxRadius;
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            this.joystick.active = false;
            this.joystick.x = 0;
            this.joystick.y = 0;
        });

        document.addEventListener('mousedown', (e) => {
             // Debounce: Ignore mouse events if touch events were triggered recently (500ms)
             if (Date.now() - this.lastTouchTime < 500) return;
             this.taps.push({ x: e.clientX, y: e.clientY });
        });
    }

    setupKeyboard() {
        window.addEventListener('keydown', (e) => {
            this.keys[e.code] = true;
            if (e.code === 'Space') this.taps.push({ x: 0, y: 0, key: 'Space' });
        });
        window.addEventListener('keyup', (e) => this.keys[e.code] = false);
    }

    getMovementVector() {
        let dx = 0, dy = 0;
        if (this.keys['ArrowUp'] || this.keys['KeyW']) dy -= 1;
        if (this.keys['ArrowDown'] || this.keys['KeyS']) dy += 1;
        if (this.keys['ArrowLeft'] || this.keys['KeyA']) dx -= 1;
        if (this.keys['ArrowRight'] || this.keys['KeyD']) dx += 1;
        if (dx !== 0 || dy !== 0) {
            const len = Math.sqrt(dx*dx + dy*dy);
            return { x: dx / len, y: dy / len };
        }
        return { x: this.joystick.x, y: this.joystick.y };
    }

    isValidJoystickZone(x, width) {
        return (GameData.settings.joystickSide === 'Left') ? x < width / 2 : x > width / 2;
    }

    checkTap(rect) {
        for (let i = 0; i < this.taps.length; i++) {
            const t = this.taps[i];
            if (t.x >= rect.x && t.x <= rect.x + rect.w && t.y >= rect.y && t.y <= rect.y + rect.h) return true;
        }
        return false;
    }

    clearTaps() { this.taps = []; }
}
