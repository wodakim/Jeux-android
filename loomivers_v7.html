<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOOMIVERS V7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* Deep void color */
            font-family: 'VT323', monospace;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- GAME CONSTANTS & STATE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let currentScene = 'BOOT';
        let lastTime = 0;
        let score = 0;
        let gameTime = 0;

        // --- DATA STRUCTURES ---
        const CHARACTERS = {
            WEAVER: { name: 'The Weaver', desc: 'Balanced. Starts with Neon Wand.', weapon: 'NEON_WAND', stat: 'Balanced', color: '#0ff', price: 0 },
            ARCHITECT: { name: 'The Architect', desc: 'Defensive. Orbiting Data Shield.', weapon: 'DATA_ORBIT', stat: 'Defense', color: '#00f', price: 0 },
            GLITCH_WITCH: { name: 'Glitch Witch', desc: 'Chaos. Spawns Reality Tears.', weapon: 'REALITY_TEAR', stat: 'Area Dmg', color: '#f0f', price: 0 },
            TANK: { name: 'The Tank', desc: 'Knockback King. Force Field.', weapon: 'FORCE_FIELD', stat: 'Health', color: '#0a0', price: 500 },
            SNIPER: { name: 'The Sniper', desc: 'Piercing Railgun.', weapon: 'PIXEL_RAIL', stat: 'Range', color: '#ff0', price: 500 },
            VIRUS: { name: 'The Virus', desc: 'Poison Trail.', weapon: 'CORRUPT_CLOUD', stat: 'DoT', color: '#0f0', price: 1000 },
            SUMMONER: { name: 'The Summoner', desc: 'Deploys Auto-Turrets.', weapon: 'AUTO_TURRET', stat: 'Minions', color: '#a0f', price: 1000 },
            NINJA: { name: 'The Ninja', desc: 'Bouncing Shuriken.', weapon: 'CYBER_SHURIKEN', stat: 'Agility', color: '#aaa', price: 1500 },
            BERSERKER: { name: 'The Berserker', desc: 'Melee Void Axe.', weapon: 'VOID_AXE', stat: 'Melee', color: '#f00', price: 2000 },
            GAMBLER: { name: 'The Gambler', desc: 'RNG Damage.', weapon: 'DICE_BOMB', stat: 'Luck', color: '#fa0', price: 2500 }
        };

        // --- UTILS ---
        function deepMerge(defaults, saved) {
            const result = { ...defaults };
            for (const key in saved) {
                if (typeof saved[key] === 'object' && saved[key] !== null && !Array.isArray(saved[key]) && typeof defaults[key] === 'object') {
                    result[key] = deepMerge(defaults[key], saved[key]);
                } else {
                    result[key] = saved[key];
                }
            }
            return result;
        }

        // --- STORAGE & SETTINGS ---
        const DefaultGameData = {
            progress: {
                highScore: 0,
                currency: 0,
                skins: ['NEON_CYAN'],
                currentSkin: 'NEON_CYAN',
                unlockedChars: ['WEAVER', 'ARCHITECT', 'GLITCH_WITCH'],
                upgrades: { health: 0, magnet: 0, damage: 0, greed: 0 },
                achievements: [],
                bestiary: {},
                nemesis: null,
                storySeen: false
            },

            settings: {
                masterVolume: 1.0,
                crtEffect: true,
                particles: 'High',
                joystickSide: 'Left',
                joystickSize: 'Medium'
            }
        };

        const GameData = {
            progress: { ...DefaultGameData.progress },
            settings: { ...DefaultGameData.settings },

            saveProgress() {
                localStorage.setItem('loomivers_progress', JSON.stringify(this.progress));
            },

            saveSettings() {
                localStorage.setItem('loomivers_settings', JSON.stringify(this.settings));
            },

            load() {
                try {
                    const prog = localStorage.getItem('loomivers_progress');
                    if (prog) {
                        this.progress = deepMerge(DefaultGameData.progress, JSON.parse(prog));
                    }
                    const set = localStorage.getItem('loomivers_settings');
                    if (set) {
                        this.settings = deepMerge(DefaultGameData.settings, JSON.parse(set));
                    }
                } catch (e) {
                    console.error("Save Data Corrupt", e);
                }
            },

            resetProgress() {
                this.progress = JSON.parse(JSON.stringify(DefaultGameData.progress));
                this.saveProgress();
            }
        };
        GameData.load();

        // Scene Manager
        const SceneManager = {
            bootTimer: 0,
            changeScene(name) {
                currentScene = name;
                input.clearTaps();
                // Music Logic
                if (name === 'PLAYING') audioController.startMusic();
                else audioController.stopMusic();
            }
        };

        // Screen Shake
        let shakeIntensity = 0;
        function addShake(amount) {
            shakeIntensity = Math.min(shakeIntensity + amount, 20);
        }

        // --- RESIZE ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- ANDROID LIFECYCLE ---
        window.pauseGame = function() {
            if (currentScene === 'PLAYING') SceneManager.changeScene('PAUSED');
        };
        window.resumeGame = function() {
            if (currentScene === 'PAUSED') {
                SceneManager.changeScene('PLAYING');
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        };
        function handleBackButton() {
            history.pushState({ page: 1 }, "title", "?page=1");
            window.onpopstate = function(event) {
                history.pushState({ page: 1 }, "title", "?page=1");
                if (currentScene === 'PLAYING') SceneManager.changeScene('PAUSED');
                else if (currentScene === 'PAUSED') SceneManager.changeScene('PLAYING');
                else if (currentScene === 'CHARACTER_SELECT') SceneManager.changeScene('HUB');
                else if (currentScene === 'SHOP') SceneManager.changeScene('HUB');
                else if (currentScene === 'HUB') SceneManager.changeScene('TITLE');
                else if (currentScene !== 'TITLE') SceneManager.changeScene('HUB');
            };
        }

        // --- AUDIO ---
        let audioCtx;
        class AudioController {
            constructor() {
                this.initialized = false;
                this.sequencerTimer = null;
                this.beatIndex = 0;
            }
            init() {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                if (audioCtx.state === 'suspended') audioCtx.resume();
                this.initialized = true;
            }

            // Synthwave Bassline Sequencer (C-G-A-F)
            startMusic() {
                if (this.sequencerTimer) return;
                const bpm = 120;
                const beatDur = 60 / bpm;
                this.beatIndex = 0;
                // Bassline Notes: C2 (65.41), G1 (49.00), A1 (55.00), F1 (43.65)
                const sequence = [65.41, 65.41, 49.00, 49.00, 55.00, 55.00, 43.65, 43.65];

                this.sequencerTimer = setInterval(() => {
                    if (GameData.settings.masterVolume > 0 && currentScene === 'PLAYING') {
                        const freq = sequence[this.beatIndex % sequence.length];
                        this.playTone('sawtooth', freq, 0.2, 0.3); // Short bass plucks
                        this.beatIndex++;
                    }
                }, beatDur * 500); // 8th notes
            }

            stopMusic() {
                if (this.sequencerTimer) {
                    clearInterval(this.sequencerTimer);
                    this.sequencerTimer = null;
                }
            }

            playTone(type, freq, dur, volMult = 1.0) {
                if (!this.initialized || GameData.settings.masterVolume <= 0) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1 * GameData.settings.masterVolume * volMult, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            }
            playPing() { this.playTone('sine', 800, 0.1); }
            playCrunch() { this.playTone('sawtooth', 100, 0.2); }
            playLevelUp() {
                if (!this.initialized) return;
                [440, 554, 659, 880].forEach((f,i) => setTimeout(() => this.playTone('square', f, 0.1), i*100));
            }
        }
        const audioController = new AudioController();
        const resumeAudio = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); audioController.init(); };
        window.addEventListener('touchstart', resumeAudio, { once: true });
        window.addEventListener('click', resumeAudio, { once: true });

        // --- INPUT ---
        class InputHandler {
            constructor() {
                this.joystick = { x: 0, y: 0, active: false, originX: 0, originY: 0 };
                this.keys = {};
                this.taps = [];
                this.setupTouch();
                this.setupKeyboard();
            }
            setupTouch() {
                document.addEventListener('touchstart', (e) => {
                    const t = e.changedTouches[0];
                    if (currentScene !== 'PLAYING') {
                        this.taps.push({ x: t.clientX, y: t.clientY });
                        return;
                    }
                    if (this.isValidJoystickZone(t.clientX, window.innerWidth)) {
                        this.joystick.active = true;
                        this.joystick.originX = t.clientX;
                        this.joystick.originY = t.clientY;
                        this.joystick.x = 0; this.joystick.y = 0;
                    }
                    this.taps.push({ x: t.clientX, y: t.clientY });
                }, { passive: false });
                document.addEventListener('touchmove', (e) => {
                    if (currentScene !== 'PLAYING' || !this.joystick.active) return;
                    e.preventDefault();
                    const t = e.changedTouches[0];
                    const dx = t.clientX - this.joystick.originX;
                    const dy = t.clientY - this.joystick.originY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    let size = 50;
                    if (GameData.settings.joystickSize === 'Small') size = 30;
                    if (GameData.settings.joystickSize === 'Large') size = 70;
                    if (dist > 0) {
                        const angle = Math.atan2(dy, dx);
                        const clamped = Math.min(dist, size);
                        this.joystick.x = (Math.cos(angle) * clamped) / size;
                        this.joystick.y = (Math.sin(angle) * clamped) / size;
                    }
                }, { passive: false });
                document.addEventListener('touchend', () => { this.joystick.active = false; this.joystick.x = 0; this.joystick.y = 0; });
                document.addEventListener('mousedown', (e) => { this.taps.push({ x: e.clientX, y: e.clientY }); });
            }
            setupKeyboard() {
                window.addEventListener('keydown', (e) => this.keys[e.code] = true);
                window.addEventListener('keyup', (e) => this.keys[e.code] = false);
            }
            getMovementVector() {
                let dx = 0, dy = 0;
                if (this.keys['ArrowUp'] || this.keys['KeyW']) dy -= 1;
                if (this.keys['ArrowDown'] || this.keys['KeyS']) dy += 1;
                if (this.keys['ArrowLeft'] || this.keys['KeyA']) dx -= 1;
                if (this.keys['ArrowRight'] || this.keys['KeyD']) dx += 1;
                if (dx !== 0 || dy !== 0) {
                    const len = Math.sqrt(dx*dx + dy*dy);
                    return { x: dx/len, y: dy/len };
                }
                return { x: this.joystick.x, y: this.joystick.y };
            }
            isValidJoystickZone(x, w) { return GameData.settings.joystickSide === 'Left' ? x < w/2 : x > w/2; }
            checkTap(rect) {
                for (const t of this.taps) {
                    if (t.x >= rect.x && t.x <= rect.x + rect.w && t.y >= rect.y && t.y <= rect.y + rect.h) return true;
                }
                return false;
            }
            clearTaps() { this.taps = []; }
        }
        const input = new InputHandler();

        // --- UI ---
        const UI = {
            buttons: [], sliders: [],
            drawButton(text, x, y, w, h, color, action) {
                ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
                ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.strokeRect(x, y, w, h);
                ctx.fillStyle = '#fff'; ctx.font = '24px VT323'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(text, x + w/2, y + h/2);
                this.buttons.push({ x, y, w, h, action });
            },
            drawSlider(label, value, x, y, w, h, onChange) {
                ctx.fillStyle = '#333'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = '#fff'; ctx.strokeRect(x, y, w, h);
                ctx.fillStyle = '#0f0'; ctx.fillRect(x, y, w * value, h);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(`${label}: ${Math.round(value*100)}%`, x, y - 15);
                this.sliders.push({ x, y, w, h, onChange });
            },
            drawSelector(label, options, currentValue, x, y, w, h, onChange) {
                ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(label, x, y - 15);
                const optW = w / options.length;
                options.forEach((opt, i) => {
                    const optX = x + i*optW;
                    const isSel = opt === currentValue;
                    ctx.fillStyle = isSel ? '#0a0' : '#333'; ctx.fillRect(optX, y, optW, h);
                    ctx.strokeStyle = '#fff'; ctx.strokeRect(optX, y, optW, h);
                    ctx.fillStyle = isSel ? '#fff' : '#aaa'; ctx.textAlign = 'center'; ctx.fillText(opt, optX + optW/2, y + h/2);
                    this.buttons.push({ x: optX, y, w: optW, h, action: () => onChange(opt) });
                });
            },
            drawToggle(label, value, x, y, w, h, onToggle) {
                this.drawSelector(label, ['OFF', 'ON'], value ? 'ON' : 'OFF', x, y, w, h, (val) => onToggle(val === 'ON'));
            },
            handleInput() {
                for (const btn of this.buttons) { if (input.checkTap(btn)) { audioController.playPing(); btn.action(); } }
                for (const sld of this.sliders) {
                    for (const t of input.taps) {
                        if (t.x >= sld.x && t.x <= sld.x + sld.w && t.y >= sld.y && t.y <= sld.y + sld.h) {
                            sld.onChange(Math.max(0, Math.min(1, (t.x - sld.x) / sld.w)));
                        }
                    }
                }
                this.buttons = []; this.sliders = [];
            }
        };

        // --- POOL ---
        class ObjectPool {
            constructor(fn, size=100) { this.createFn = fn; this.pool = []; this.active = []; for(let i=0;i<size;i++) this.pool.push(fn()); }
            get() { const o = this.pool.length ? this.pool.pop() : this.createFn(); o.active = true; this.active.push(o); return o; }
            release(o) { const i = this.active.indexOf(o); if(i>-1) { this.active.splice(i, 1); o.active = false; this.pool.push(o); } }
            reset() { while(this.active.length) { const o = this.active.pop(); o.active = false; this.pool.push(o); } }
        }

        // --- ENTITIES ---
        class Player {
            constructor() {
                this.x = 0; this.y = 0; this.width = 20; this.height = 20;
                this.speed = 200; this.hp = 100; this.maxHp = 100;
                this.xp = 0; this.nextLevelXp = 10; this.level = 1;
                this.weapons = []; this.iframeTimer = 0; this.color = '#0ff';
                this.damageMult = 1.0; this.fireRateMult = 1.0;
                this.glitchMeter = 0; this.glitchMax = 100; this.overdriveActive = false; this.overdriveTimer = 0;
            }
            init(charType) {
                const config = CHARACTERS[charType] || CHARACTERS.WEAVER;
                this.reset();
                this.color = config.color;
                this.addWeapon(config.weapon);
                // Apply Passive Stat Bonuses
                if(charType === 'ARCHITECT') this.maxHp += 20;
                if(charType === 'TANK') { this.maxHp += 50; this.speed -= 20; }
                if(charType === 'SNIPER') this.damageMult += 0.2;
                if(charType === 'NINJA') this.speed += 40;
                if(charType === 'BERSERKER') { this.damageMult += 0.5; this.maxHp += 30; }
                if(charType === 'GAMBLER') this.luck = 1; // Special flag
                this.hp = this.maxHp; // Heal to full
            }
            reset() {
                this.maxHp = 100 + (GameData.progress.upgrades.health * 10);
                this.damageMult = 1.0 + (GameData.progress.upgrades.damage * 0.05);
                this.x = canvas.width/2; this.y = canvas.height/2;
                this.hp = this.maxHp; this.speed = 200; this.xp = 0; this.nextLevelXp = 10; this.level = 1;
                this.iframeTimer = 0; this.weapons = []; this.fireRateMult = 1.0;
                this.glitchMeter = 0; this.overdriveActive = false;
            }
            activateOverdrive() {
                if(this.glitchMeter >= this.glitchMax && !this.overdriveActive) {
                    this.overdriveActive = true; this.overdriveTimer = 5.0; this.glitchMeter = 0;
                    addShake(20);
                }
            }
            addWeapon(type) {
                const w = { type, cooldown: 0, level: 1 };
                // Weapon stats
                if (type === 'NEON_WAND') { w.fireRate = 0.5; w.damage = 10; }
                else if (type === 'DATA_ORBIT') { w.fireRate = 0; w.damage = 5; w.angle = 0; }
                else if (type === 'GLITCH_BOMB') { w.fireRate = 2.0; w.damage = 30; }
                else if (type === 'REALITY_TEAR') { w.fireRate = 3.0; w.damage = 50; }
                else if (type === 'FORCE_FIELD') { w.fireRate = 1.5; w.damage = 10; w.pushback = 200; }
                else if (type === 'PIXEL_RAIL') { w.fireRate = 1.5; w.damage = 25; }
                else if (type === 'CORRUPT_CLOUD') { w.fireRate = 0.5; w.damage = 5; } // DoT spawn
                else if (type === 'AUTO_TURRET') { w.fireRate = 5.0; w.damage = 10; }
                else if (type === 'CYBER_SHURIKEN') { w.fireRate = 0.8; w.damage = 15; }
                else if (type === 'VOID_AXE') { w.fireRate = 1.0; w.damage = 40; }
                else if (type === 'DICE_BOMB') { w.fireRate = 1.5; w.damage = 0; } // Random calc on hit
                this.weapons.push(w);
            }
            update(dt) {
                // Overdrive
                let sMult = 1.0, fMult = 1.0;
                if(this.overdriveActive) {
                    this.overdriveTimer -= dt; sMult = 2.0; fMult = 2.0; this.iframeTimer = 0.1;
                    if(this.overdriveTimer <= 0) { this.overdriveActive = false; corruptionLevel++; }
                }
                // Move
                const vec = input.getMovementVector();
                this.x += vec.x * this.speed * sMult * dt;
                this.y += vec.y * this.speed * sMult * dt;
                this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
                this.y = Math.max(0, Math.min(canvas.height - this.height, this.y));
                if(this.iframeTimer > 0) this.iframeTimer -= dt;

                // Weapons
                this.weapons.forEach(w => {
                    if (w.type === 'DATA_ORBIT') w.angle += 3 * dt * fMult;
                    else {
                        w.cooldown -= dt * fMult;
                        if(w.cooldown <= 0) fireWeaponGlobal(this, w);
                    }
                });
            }
            takeDamage(amt) {
                if(this.iframeTimer > 0) return;
                this.hp -= amt; this.iframeTimer = 0.5;
                if(this.hp <= 0) endGame();
            }
            gainXp(amt) {
                this.xp += amt; audioController.playPing();
                if(this.xp >= this.nextLevelXp) {
                    this.xp -= this.nextLevelXp; this.level++;
                    this.nextLevelXp = Math.floor(this.nextLevelXp * 1.5);
                    audioController.playLevelUp();
                    triggerLevelUpScreen();
                }
            }
        }
        const player = new Player();

        class Enemy {
            constructor() { this.active = false; }
            init(type, x, y) {
                this.active = true; this.type = type; this.x = x; this.y = y;
                this.flashTimer = 0; this.knockbackX = 0; this.knockbackY = 0; this.attackTimer = 0;
                if (type === 'SWARMER') { this.w = 15; this.h = 15; this.hp = 10 + player.level*2; this.speed = 80; this.color = '#f00'; }
                else if (type === 'TANK') { this.w = 30; this.h = 30; this.hp = 50 + player.level*10; this.speed = 40; this.color = '#900'; }
                else if (type === 'GLITCH_MITE') { this.w = 12; this.h = 12; this.hp = 5 + player.level; this.speed = 120; this.color = '#ff0'; }
                else if (type === 'WARDEN') { this.w = 60; this.h = 60; this.hp = 5000 + player.level*100; this.maxHp = this.hp; this.speed = 60; this.color = '#f0f'; }

                // Endless Mode Buff
                if(endlessMode) { this.hp *= 1.5; this.speed *= 1.5; }
            }
            update(dt) {
                if(!this.active) return;
                if(this.flashTimer > 0) this.flashTimer -= dt;

                // Knockback
                if(Math.abs(this.knockbackX) > 1 || Math.abs(this.knockbackY) > 1) {
                    this.x += this.knockbackX*dt; this.y += this.knockbackY*dt;
                    this.knockbackX *= 0.9; this.knockbackY *= 0.9;
                } else {
                    // Separation (Skip for Boss)
                    let sepX = 0, sepY = 0;
                    if(this.type !== 'WARDEN') {
                        let checks = 0;
                        for(const o of enemyPool.active) {
                            if(checks>10) break;
                            if(o === this || o.type === 'WARDEN') continue;
                            const dx = this.x - o.x, dy = this.y - o.y;
                            if(Math.abs(dx)>30 || Math.abs(dy)>30) continue;
                            const d2 = dx*dx + dy*dy;
                            if(d2 < 900 && d2 > 0) {
                                const d = Math.sqrt(d2);
                                sepX += (dx/d) * ((30-d)/30) * 100;
                                sepY += (dy/d) * ((30-d)/30) * 100;
                                checks++;
                            }
                        }
                    }
                    // Chase
                    const dx = player.x - this.x, dy = player.y - this.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if(d>0) {
                        this.x += (dx/d * this.speed + sepX) * dt;
                        this.y += (dy/d * this.speed + sepY) * dt;
                    }

                    // Boss Logic
                    if(this.type === 'WARDEN') {
                        this.attackTimer += dt;
                        const rate = this.hp < this.maxHp*0.5 ? 1.0 : 2.0;
                        if(this.attackTimer > rate) {
                            this.attackTimer = 0;
                            for(let i=-1; i<=1; i++) projectilePool.get().init('BOSS_ORB', this.x+this.w/2, this.y+this.h/2, player.x + i*50, player.y + i*50, 20, true);
                            audioController.playCrunch();
                        }
                    } else if (this.type === 'TANK') {
                        if(Math.random() < 0.05) spawnParticle(this.x+this.w/2, this.y+this.h/2, '#500');
                    }
                }
            }
            takeDamage(amt, kb=0, sx=0, sy=0) {
                this.hp -= amt; this.flashTimer = 0.1;
                if(kb > 0) {
                    const dx = this.x - sx, dy = this.y - sy;
                    const d = Math.sqrt(dx*dx + dy*dy) || 1;
                    this.knockbackX = (dx/d) * kb; this.knockbackY = (dy/d) * kb;
                }
                spawnDamageText(amt, this.x, this.y);
                if(this.hp <= 0) this.die();
            }
            die() {
                this.active = false; audioController.playCrunch(); enemyPool.release(this);
                if(Math.random() < 0.1) spawnGem(this.x, this.y, 10, true);
                else spawnGem(this.x, this.y, this.type==='TANK'?5:1, false);
                if(player.glitchMeter < player.glitchMax) player.glitchMeter++;
                for(let i=0;i<3;i++) spawnParticle(this.x, this.y, this.color);
                score += this.type==='TANK'?50:10;

                if(this.type === 'WARDEN') {
                    // Trigger Endless Mode
                    endlessMode = true;
                    spawnDamageText("REALITY FRACTURED!", player.x, player.y - 50);
                    spawnDamageText("ENDLESS MODE ENGAGED", player.x, player.y);
                    addShake(50);
                }

                if(this.isNemesis) {
                    player.gainXp(100); GameData.progress.nemesis = null; GameData.saveProgress();
                    spawnDamageText("NEMESIS DEFEATED!", this.x, this.y - 30);
                }
            }
        }
        const enemyPool = new ObjectPool(() => new Enemy(), 200);

        class Projectile {
            constructor() { this.active = false; }
            init(type, x, y, tx, ty, dmg, isEnemy=false) {
                this.active = true; this.type = type; this.x = x; this.y = y; this.damage = dmg; this.isEnemy = isEnemy;
                this.duration = 3; this.vx = 0; this.vy = 0; this.w = 10; this.h = 10;

                if(type === 'NEON_WAND' || type === 'BOSS_ORB' || type === 'CYBER_SHURIKEN' || type === 'DICE_BOMB') {
                    const speed = type==='BOSS_ORB'?150 : type==='CYBER_SHURIKEN'?300 : type==='DICE_BOMB'?250 : 400;
                    const dx = tx - x, dy = ty - y;
                    const d = Math.sqrt(dx*dx + dy*dy) || 1;
                    this.vx = (dx/d)*speed; this.vy = (dy/d)*speed;
                    this.w = 8; this.h = 8;
                    if(type==='CYBER_SHURIKEN') this.bounces = 3;
                } else if(type === 'GLITCH_BOMB') {
                    const dx = tx - x, dy = ty - y;
                    const d = Math.sqrt(dx*dx + dy*dy) || 1;
                    this.vx = (dx/d)*200; this.vy = (dy/d)*200;
                    this.w = 16; this.h = 16;
                } else if(type === 'PIXEL_RAIL') {
                    this.duration = 0.2; this.tx = tx; this.ty = ty;
                } else if(type === 'REALITY_TEAR' || type === 'CORRUPT_CLOUD') {
                    this.duration = 5; this.w = 40; this.h = 40;
                } else if(type === 'VOID_AXE') {
                    this.duration = 0.3; this.vx = (tx-x); this.vy = (ty-y); this.w = 60; this.h = 60;
                } else if(type === 'AUTO_TURRET') {
                    this.duration = 10; this.fireTimer = 0; this.w = 20; this.h = 20;
                }
            }
            update(dt) {
                if(!this.active) return;

                if(this.type === 'AUTO_TURRET') {
                    this.fireTimer += dt;
                    if(this.fireTimer > 1.0) {
                        this.fireTimer = 0;
                        let near = null, minDist = 99999;
                        for(const e of enemyPool.active) {
                            const d = (e.x-this.x)**2 + (e.y-this.y)**2;
                            if(d<minDist) { minDist=d; near=e; }
                        }
                        if(near) projectilePool.get().init('NEON_WAND', this.x, this.y, near.x, near.y, this.damage);
                    }
                } else if (this.type === 'CYBER_SHURIKEN') {
                    this.x += this.vx * dt; this.y += this.vy * dt;
                    if(this.x < 0 || this.x > canvas.width) { this.vx *= -1; this.bounces--; }
                    if(this.y < 0 || this.y > canvas.height) { this.vy *= -1; this.bounces--; }
                    if(this.bounces < 0) this.duration = 0;
                } else if (this.type !== 'REALITY_TEAR' && this.type !== 'CORRUPT_CLOUD' && this.type !== 'PIXEL_RAIL' && this.type !== 'VOID_AXE') {
                    this.x += this.vx * dt; this.y += this.vy * dt;
                }

                this.duration -= dt;
                if(this.duration <= 0) projectilePool.release(this);
            }
        }
        const projectilePool = new ObjectPool(() => new Projectile(), 200);

        class Gem { constructor() { this.active = false; } init(x, y, v, d) { this.active = true; this.x = x; this.y = y; this.val = v; this.isData = d; this.w = d?12:8; this.h = d?12:8; } }
        const gemPool = new ObjectPool(() => new Gem(), 200);

        class Particle { constructor() { this.active = false; } init(x, y, c) { this.active = true; this.x = x; this.y = y; this.c = c; this.life = 0.5+Math.random()*0.5; const a = Math.random()*6.28, s = Math.random()*200+50; this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s; } update(dt) { if(!this.active) return; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=0.95; this.vy*=0.95; this.life-=dt; if(this.life<=0) particlePool.release(this); } }
        const particlePool = new ObjectPool(() => new Particle(), 200);

        class DamageText { constructor() { this.active = false; } init(amt, x, y) { this.active = true; this.x = x; this.y = y; this.txt = typeof amt==='number'?Math.floor(amt):amt; this.life = 0.8; } update(dt) { if(!this.active) return; this.y-=50*dt; this.life-=dt; if(this.life<=0) damageTextPool.release(this); } }
        const damageTextPool = new ObjectPool(() => new DamageText(), 50);

        // --- HELPERS ---
        function spawnGem(x,y,v,d) { gemPool.get().init(x,y,v,d); }
        function spawnParticle(x,y,c) { particlePool.get().init(x,y,c); }
        function spawnDamageText(a,x,y) { damageTextPool.get().init(a,x,y); }
        function hit(a, b) {
            const aw = a.w || a.width, ah = a.h || a.height;
            const bw = b.w || b.width, bh = b.h || b.height;
            return a.x < b.x+bw && a.x+aw > b.x && a.y < b.y+bh && a.y+ah > b.y;
        }

        function fireWeaponGlobal(p, w) {
            let near = null, min = 99999;
            for(const e of enemyPool.active) { const d = (e.x-p.x)**2 + (e.y-p.y)**2; if(d<min) { min=d; near=e; } }

            w.cooldown = w.fireRate * p.fireRateMult;
            const dmg = w.damage * p.damageMult;

            if(w.type === 'NEON_WAND' && near) projectilePool.get().init('NEON_WAND', p.x, p.y, near.x, near.y, dmg);
            else if(w.type === 'GLITCH_BOMB') {
                const tx = near ? near.x : p.x + Math.cos(Math.random()*6.28)*150;
                const ty = near ? near.y : p.y + Math.sin(Math.random()*6.28)*150;
                projectilePool.get().init('GLITCH_BOMB', p.x, p.y, tx, ty, dmg);
            }
            else if(w.type === 'REALITY_TEAR') {
                const rx = p.x + (Math.random()-0.5)*300;
                const ry = p.y + (Math.random()-0.5)*300;
                projectilePool.get().init('REALITY_TEAR', rx, ry, 0, 0, dmg);
            }
            else if(w.type === 'FORCE_FIELD') {
                createExplosion(p.x, p.y, dmg, w.pushback);
            }
            else if(w.type === 'PIXEL_RAIL' && near) {
                const angle = Math.atan2(near.y - p.y, near.x - p.x);
                const ex = p.x + Math.cos(angle) * 1000;
                const ey = p.y + Math.sin(angle) * 1000;
                projectilePool.get().init('PIXEL_RAIL', p.x, p.y, ex, ey, dmg);
            }
            else if(w.type === 'CORRUPT_CLOUD') {
                projectilePool.get().init('CORRUPT_CLOUD', p.x, p.y, 0, 0, dmg);
            }
            else if(w.type === 'AUTO_TURRET') {
                projectilePool.get().init('AUTO_TURRET', p.x, p.y, 0, 0, dmg);
            }
            else if(w.type === 'CYBER_SHURIKEN' && near) {
                projectilePool.get().init('CYBER_SHURIKEN', p.x, p.y, near.x, near.y, dmg);
            }
            else if(w.type === 'VOID_AXE') {
                const tx = near ? near.x : p.x+100;
                const ty = near ? near.y : p.y;
                projectilePool.get().init('VOID_AXE', p.x, p.y, tx, ty, dmg);
            }
            else if(w.type === 'DICE_BOMB' && near) {
                const roll = Math.floor(Math.random()*100)+1;
                projectilePool.get().init('DICE_BOMB', p.x, p.y, near.x, near.y, roll);
            }
        }

        function createExplosion(x,y,dmg, push=0) {
            addShake(10);
            for(const e of enemyPool.active) {
                const d = Math.sqrt((e.x-x)**2 + (e.y-y)**2);
                if(d < 100) e.takeDamage(dmg, push, x, y);
            }
            for(let i=0;i<10;i++) spawnParticle(x,y,'#ff0');
        }

        // --- LEVEL UP ---
        let upgradeChoices = [];
        const WEAPON_TYPES = ['NEON_WAND', 'DATA_ORBIT', 'GLITCH_BOMB', 'REALITY_TEAR', 'FORCE_FIELD', 'PIXEL_RAIL', 'CORRUPT_CLOUD', 'AUTO_TURRET', 'CYBER_SHURIKEN', 'VOID_AXE', 'DICE_BOMB'];

        function triggerLevelUpScreen() {
            SceneManager.changeScene('LEVEL_UP');
            input.clearTaps();
            upgradeChoices = [];
            while(upgradeChoices.length < 3) {
                const r = Math.random();
                let pick;
                if(r < 0.3) pick = { id: 'HEAL', title:'Repair', desc:'+50 HP' };
                else if(r < 0.6) pick = { id: 'DMG', title:'Power', desc:'+20% Dmg' };
                else {
                    const wId = WEAPON_TYPES[Math.floor(Math.random()*WEAPON_TYPES.length)];
                    pick = { id: wId, title: wId.replace('_',' '), desc: 'New Weapon' };
                }
                if(!upgradeChoices.find(c=>c.id===pick.id)) upgradeChoices.push(pick);
            }
        }

        function selectUpgrade(id) {
            if(id==='HEAL') player.hp = Math.min(player.maxHp, player.hp+50);
            else if(id==='DMG') player.damageMult *= 1.2;
            else {
                const exist = player.weapons.find(w=>w.type===id);
                if(exist) { exist.level++; exist.damage *= 1.2; }
                else player.addWeapon(id);
            }
            SceneManager.changeScene('PLAYING');
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // --- GAME LOOP ---
        let spawnTimer = 0, waveTimer = 0, corruptionLevel = 0;
        let nemesisSpawned = false, bossSpawned = false, endlessMode = false;

        function updateGame(dt) {
            gameTime += dt; spawnTimer += dt; waveTimer += dt;

            const diff = 1.0 + corruptionLevel*0.1 + (endlessMode?0.5:0);
            const rate = Math.max(0.1, (1.5 - gameTime/60 * 0.1)/diff);

            if(!bossSpawned && gameTime > 120) {
                bossSpawned = true;
                enemyPool.get().init('WARDEN', player.x + 400, player.y);
                spawnDamageText("WARNING: WARDEN", player.x, player.y-100);
            }

            if(spawnTimer > rate && (!bossSpawned || endlessMode)) {
                spawnTimer = 0;
                const a = Math.random()*6.28, r = 500;
                const sx = player.x + Math.cos(a)*r, sy = player.y + Math.sin(a)*r;
                let type = 'SWARMER';
                if(Math.random()>0.9) type = 'GLITCH_MITE';
                else if(Math.random()>0.85) type = 'TANK';
                enemyPool.get().init(type, sx, sy);
            }

            player.update(dt);
            enemyPool.active.forEach(e => e.update(dt));
            projectilePool.active.forEach(p => p.update(dt));
            gemPool.active.forEach(g => {
                const d = Math.sqrt((player.x-g.x)**2 + (player.y-g.y)**2);
                if(d<100) { g.x+=(player.x-g.x)/d*300*dt; g.y+=(player.y-g.y)/d*300*dt; }
                if(hit(player, {x:g.x, y:g.y, w:g.w, h:g.h})) {
                    if(g.isData) { GameData.progress.currency += g.val; spawnDamageText("+$"+g.val, player.x, player.y-20); audioController.playPing(); }
                    else player.gainXp(g.val);
                    gemPool.release(g);
                }
            });
            particlePool.active.forEach(p => p.update(dt));
            damageTextPool.active.forEach(t => t.update(dt));

            if(player.iframeTimer <= 0) {
                for(const e of enemyPool.active) {
                    if(hit(player, {x:e.x, y:e.y, w:e.w, h:e.h})) {
                        player.takeDamage(10); addShake(10); break;
                    }
                }
            }

            for(const p of projectilePool.active) {
                if(p.isEnemy) {
                    if(hit(player, {x:p.x, y:p.y, w:p.w, h:p.h})) { player.takeDamage(p.damage); projectilePool.release(p); }
                } else {
                    if(p.type === 'PIXEL_RAIL') {
                        // Instant hit handled in init/fire logic usually, but here we just render
                        // To be precise, damage was done in update frame 1 or we need Raycast
                    } else if (p.type === 'REALITY_TEAR' || p.type === 'CORRUPT_CLOUD' || p.type === 'VOID_AXE') {
                        for(const e of enemyPool.active) {
                            if(hit({x:p.x, y:p.y, w:p.w, h:p.h}, {x:e.x, y:e.y, w:e.w, h:e.h})) {
                                if(Math.random() < 0.1) e.takeDamage(p.damage);
                            }
                        }
                    } else {
                        for(const e of enemyPool.active) {
                            if(hit({x:p.x, y:p.y, w:p.w, h:p.h}, {x:e.x, y:e.y, w:e.w, h:e.h})) {
                                if(p.type==='GLITCH_BOMB' || p.type==='DICE_BOMB') createExplosion(p.x, p.y, p.damage);
                                else e.takeDamage(p.damage, 100, p.x, p.y);
                                if(!p.penetrate) { projectilePool.release(p); break; }
                            }
                        }
                    }
                }
            }

            const orbit = player.weapons.find(w=>w.type==='DATA_ORBIT');
            if(orbit) {
                const ox = player.x+10 + Math.cos(orbit.angle)*60;
                const oy = player.y+10 + Math.sin(orbit.angle)*60;
                for(const e of enemyPool.active) {
                    const d = Math.sqrt((e.x-ox)**2 + (e.y-oy)**2);
                    if(d < 30 && Math.random()<0.1) e.takeDamage(orbit.damage, 10, player.x, player.y);
                }
            }
        }

        // --- RENDER ---
        function drawGridBackground(time) {
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const gridSize = 50;
            const shiftY = (time * 20) % gridSize;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = shiftY; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function render() {
            ctx.setTransform(1,0,0,1,0,0);
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,canvas.width, canvas.height);

            ctx.strokeStyle='#111'; ctx.lineWidth=1; ctx.beginPath();
            const gx = -(player.x%50), gy = -(player.y%50);
            for(let i=gx; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
            for(let i=gy; i<canvas.height; i+=50) { ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); }
            ctx.stroke();

            if(shakeIntensity>0) { ctx.translate((Math.random()-.5)*shakeIntensity, (Math.random()-.5)*shakeIntensity); shakeIntensity*=0.9; }
            ctx.save();
            ctx.translate(canvas.width/2 - player.x - 10, canvas.height/2 - player.y - 10);

            const all = [
                {y:player.y+20, d:()=>drawPlayer()},
                ...enemyPool.active.map(e=>({y:e.y+e.h, d:()=>drawEnemy(e)})),
                ...gemPool.active.map(g=>({y:g.y+g.h, d:()=>drawGem(g)}))
            ].sort((a,b)=>a.y-b.y);

            all.forEach(x=>x.d());

            projectilePool.active.forEach(p=>drawProjectile(p));
            particlePool.active.forEach(p=>{ ctx.fillStyle=p.c; ctx.globalAlpha=p.life*2; ctx.fillRect(p.x,p.y,4,4); ctx.globalAlpha=1; });
            damageTextPool.active.forEach(t=>{ ctx.fillStyle='#fff'; ctx.font='30px VT323'; ctx.fillText(t.txt, t.x, t.y); });

            const o = player.weapons.find(w=>w.type==='DATA_ORBIT');
            if(o) {
                const ox = player.x+10 + Math.cos(o.angle)*60, oy = player.y+10 + Math.sin(o.angle)*60;
                ctx.fillStyle='#0ff'; ctx.beginPath(); ctx.arc(ox,oy,5,0,6.28); ctx.fill();
            }

            ctx.restore();

            // HUD
            ctx.fillStyle='#fff'; ctx.font='24px VT323'; ctx.textAlign='left';
            ctx.fillText(`SCORE: ${score}`, 20, 40);
            ctx.fillText(`TIME: ${Math.floor(gameTime/60)}:${(Math.floor(gameTime%60)+"").padStart(2,'0')}`, 20, 70);

            // HP
            const bw = 200, bx = (canvas.width-bw)/2, by = canvas.height-40;
            ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,20);
            ctx.fillStyle='#0f0'; ctx.fillRect(bx,by,bw*(Math.max(0,player.hp)/player.maxHp),20);
            ctx.strokeStyle='#fff'; ctx.strokeRect(bx,by,bw,20);

            // Boss HP
            const boss = enemyPool.active.find(e=>e.type==='WARDEN');
            if(boss) {
                ctx.fillStyle='#300'; ctx.fillRect(20,20,canvas.width-40,30);
                ctx.fillStyle='#f00'; ctx.fillRect(20,20,(canvas.width-40)*(boss.hp/boss.maxHp),30);
                ctx.strokeStyle='#fff'; ctx.strokeRect(20,20,canvas.width-40,30);
                ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText("THE WARDEN", canvas.width/2, 42);
            }

            // Overdrive
            if(player.glitchMeter>=player.glitchMax) {
                UI.drawButton('OVERDRIVE', canvas.width-150, canvas.height-100, 130, 80, '#f0f', ()=>player.activateOverdrive());
            } else {
                ctx.fillStyle='#333'; ctx.fillRect(canvas.width-150, canvas.height-40, 130, 20);
                ctx.fillStyle='#f0f'; ctx.fillRect(canvas.width-150, canvas.height-40, 130*(player.glitchMeter/player.glitchMax), 20);
            }

            if(GameData.settings.crtEffect) drawCRT();
            UI.handleInput();
        }

        function drawPlayer() {
            ctx.fillStyle=player.color; ctx.fillRect(player.x, player.y, 20, 20);
            ctx.fillStyle='#0aa'; ctx.fillRect(player.x+20, player.y+4, 4, 20); ctx.fillRect(player.x+4, player.y+20, 20, 4);
        }
        function drawEnemy(e) {
            ctx.fillStyle=e.flashTimer>0 ? '#fff' : e.color; ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(e.x+e.w, e.y+4, 4, e.h); ctx.fillRect(e.x+4, e.y+e.h, e.w, 4);
        }
        function drawGem(g) { ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.moveTo(g.x+g.w/2, g.y); ctx.lineTo(g.x+g.w, g.y+g.h/2); ctx.lineTo(g.x+g.w/2, g.y+g.h); ctx.lineTo(g.x, g.y+g.h/2); ctx.fill(); }
        function drawProjectile(p) {
            ctx.fillStyle='#fff';
            if(p.type==='BOSS_ORB') { ctx.fillStyle='#f00'; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,6.28); ctx.fill(); }
            else if(p.type==='REALITY_TEAR') { ctx.fillStyle='#f0f'; ctx.globalAlpha=0.5; ctx.fillRect(p.x-20, p.y-20, 40, 40); ctx.globalAlpha=1; }
            else if(p.type==='CORRUPT_CLOUD') { ctx.fillStyle='#0f0'; ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(p.x,p.y,30,0,6.28); ctx.fill(); ctx.globalAlpha=1; }
            else if(p.type==='PIXEL_RAIL') { ctx.strokeStyle='#ff0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.tx, p.ty); ctx.stroke(); }
            else ctx.fillRect(p.x, p.y, p.w, p.h);
        }
        function drawCRT() { ctx.fillStyle="rgba(0,0,0,0.1)"; for(let i=0;i<canvas.height;i+=4)ctx.fillRect(0,i,canvas.width,2); }

        function startGame(charType) {
            score = 0; gameTime = 0; spawnTimer = 0; waveTimer = 0;
            bossSpawned = false; nemesisSpawned = false; endlessMode = false;
            player.init(charType);
            enemyPool.reset(); projectilePool.reset(); gemPool.reset(); particlePool.reset(); damageTextPool.reset();
            SceneManager.changeScene('PLAYING');
            lastTime = performance.now(); requestAnimationFrame(gameLoop);
        }

        function renderCharacterSelect() {
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#fff'; ctx.font = '40px VT323'; ctx.textAlign = 'center'; ctx.fillText("SELECT CHARACTER", canvas.width/2, 50);

            const list = Object.keys(CHARACTERS);
            const cols = 5;
            const startX = 100, startY = 120, gapX = 150, gapY = 180;

            list.forEach((key, i) => {
                const char = CHARACTERS[key];
                const r = Math.floor(i/cols), c = i%cols;
                const x = startX + c*gapX;
                const y = startY + r*gapY;
                const unlocked = GameData.progress.unlockedChars.includes(key);

                // Card Bg
                ctx.fillStyle = '#222'; ctx.fillRect(x, y, 130, 160);
                ctx.strokeStyle = unlocked ? char.color : '#555'; ctx.strokeRect(x, y, 130, 160);

                // Icon
                ctx.fillStyle = char.color; ctx.fillRect(x+45, y+20, 40, 40);

                // Name
                ctx.fillStyle = '#fff'; ctx.font = '20px VT323'; ctx.fillText(char.name, x+65, y+80);

                // Stat
                ctx.fillStyle = '#aaa'; ctx.font = '16px VT323'; ctx.fillText(char.stat, x+65, y+100);

                if(unlocked) {
                    UI.drawButton("SELECT", x+15, y+120, 100, 30, '#0a0', () => startGame(key));
                } else {
                    if(GameData.progress.currency >= char.price) {
                        UI.drawButton(`${char.price}`, x+15, y+120, 100, 30, '#aa0', () => {
                            GameData.progress.currency -= char.price;
                            GameData.progress.unlockedChars.push(key);
                            GameData.saveProgress();
                        });
                    } else {
                        ctx.fillStyle = '#500'; ctx.fillText("LOCKED", x+65, y+135);
                        ctx.fillText(char.price, x+65, y+150);
                    }
                }
            });

            UI.drawButton("BACK", 20, canvas.height-70, 100, 50, '#555', () => SceneManager.changeScene('HUB'));
            UI.handleInput();
        }

        function renderShop() {
             ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
             ctx.fillStyle = '#fff'; ctx.font = '40px VT323'; ctx.textAlign = 'center'; ctx.fillText('THE BLACKSMITH', canvas.width/2, 50);
             ctx.fillStyle = '#ff0'; ctx.font = '24px VT323'; ctx.fillText(`FRAGMENTS: ${GameData.progress.currency}`, canvas.width/2, 80);

             const upgrades = [
                 { id: 'health', name: 'MAX HP', desc: '+10 HP per Level' },
                 { id: 'damage', name: 'DAMAGE', desc: '+5% DMG per Level' },
                 { id: 'magnet', name: 'MAGNET', desc: '+20 Range per Level' },
                 { id: 'greed', name: 'GREED', desc: '+10% Loot Chance' }
             ];

             let y = 120;
             upgrades.forEach(up => {
                 const lvl = GameData.progress.upgrades[up.id] || 0;
                 const cost = (lvl+1)*200;

                 ctx.textAlign = 'left';
                 ctx.fillStyle = '#fff'; ctx.fillText(`${up.name} (LVL ${lvl})`, canvas.width/2 - 200, y + 25);
                 ctx.fillStyle = '#aaa'; ctx.font = '18px VT323'; ctx.fillText(up.desc, canvas.width/2 - 200, y + 45);
                 ctx.font = '24px VT323';

                 if (GameData.progress.currency >= cost) {
                     UI.drawButton(`BUY ${cost}`, canvas.width/2 + 100, y, 120, 40, '#0a0', () => {
                         GameData.progress.currency -= cost;
                         GameData.progress.upgrades[up.id] = (GameData.progress.upgrades[up.id] || 0) + 1;
                         GameData.saveProgress();
                     });
                 } else {
                     ctx.fillStyle = '#333'; ctx.fillRect(canvas.width/2 + 100, y, 120, 40);
                     ctx.strokeStyle = '#fff'; ctx.strokeRect(canvas.width/2 + 100, y, 120, 40);
                     ctx.fillStyle = '#777'; ctx.fillText(cost, canvas.width/2 + 140, y + 25);
                 }
                 y += 70;
             });

             UI.drawButton('BACK', 20, canvas.height - 70, 100, 50, '#555', () => SceneManager.changeScene('HUB'));
             UI.handleInput();
        }

        // --- LOOP ---
        function gameLoop(ts) {
            const dt = Math.min((ts - lastTime)/1000, 0.1); lastTime = ts;

            if (currentScene === 'BOOT') {
                SceneManager.bootTimer += dt;
                ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle='#0ff'; ctx.textAlign='center'; ctx.fillText("LOADING V7...", canvas.width/2, canvas.height/2);
                if(SceneManager.bootTimer>1) SceneManager.changeScene('TITLE');
            } else if (currentScene === 'TITLE') {
                drawGridBackground(ts*0.05);
                ctx.fillStyle='#0ff'; ctx.font='80px VT323'; ctx.textAlign='center'; ctx.fillText("LOOMIVERS", canvas.width/2, 100);
                UI.drawButton('PLAY', canvas.width/2-100, 220, 200, 50, '#0a0', () => SceneManager.changeScene('HUB'));
                UI.drawButton('SETTINGS', canvas.width/2-100, 290, 200, 50, '#333', () => SceneManager.changeScene('SETTINGS'));
                UI.handleInput();
            } else if (currentScene === 'HUB') {
                renderHub();
            } else if (currentScene === 'CHARACTER_SELECT') {
                renderCharacterSelect();
            } else if (currentScene === 'SHOP') {
                renderShop();
            } else if (currentScene === 'PLAYING') {
                updateGame(dt); render();
            } else if (currentScene === 'SETTINGS') {
                renderSettings();
            } else if (currentScene === 'GAME_OVER' || currentScene === 'PAUSED' || currentScene === 'LEVEL_UP') {
                // Reuse existing functions logic or simplified calls
                if(currentScene === 'PAUSED') {
                    render(); ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                    UI.drawButton('RESUME', canvas.width/2-100, 200, 200, 50, '#00f', ()=>SceneManager.changeScene('PLAYING'));
                    UI.drawButton('QUIT', canvas.width/2-100, 270, 200, 50, '#f00', ()=>SceneManager.changeScene('HUB'));
                    UI.handleInput();
                } else if(currentScene === 'GAME_OVER') {
                    render(); ctx.fillStyle='rgba(50,0,0,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle='#f00'; ctx.fillText("FAILURE", canvas.width/2, 150);
                    ctx.fillStyle='#fff'; ctx.fillText(`SCORE: ${score}`, canvas.width/2, 200);
                    UI.drawButton('HUB', canvas.width/2-100, 300, 200, 50, '#333', ()=>SceneManager.changeScene('HUB'));
                    UI.handleInput();
                } else if(currentScene === 'LEVEL_UP') {
                    render(); ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle='#ff0'; ctx.fillText("LEVEL UP", canvas.width/2, 80);
                    let y = 150;
                    upgradeChoices.forEach(c => {
                        UI.drawButton(`${c.title} - ${c.desc}`, canvas.width/2-200, y, 400, 60, '#222', ()=>selectUpgrade(c.id));
                        y+=80;
                    });
                    UI.handleInput();
                }
            }

            input.clearTaps();
            requestAnimationFrame(gameLoop);
        }

        // --- FIXED SETTINGS RENDER ---
        function renderSettings() {
             ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
             ctx.fillStyle = '#fff'; ctx.font = '40px VT323'; ctx.textAlign = 'center'; ctx.fillText('SETTINGS', canvas.width/2, 50);
             const cX = canvas.width/2 - 150;
             let y = 100;
             const gap = 100; // Increased Padding

             UI.drawSlider("MASTER VOLUME", GameData.settings.masterVolume, cX, y, 300, 30, (val) => { GameData.settings.masterVolume = val; GameData.saveSettings(); });
             y += gap;
             UI.drawToggle("CRT EFFECT", GameData.settings.crtEffect, cX, y, 100, 40, (val) => { GameData.settings.crtEffect = val; GameData.saveSettings(); });
             const pVal = GameData.settings.particles === 'High';
             UI.drawToggle("PARTICLES", pVal, cX + 150, y, 150, 40, (val) => { GameData.settings.particles = val ? 'High' : 'Low'; GameData.saveSettings(); });
             y += gap;
             UI.drawSelector("JOYSTICK SIDE", ['Left', 'Right'], GameData.settings.joystickSide, cX, y, 300, 40, (val) => { GameData.settings.joystickSide = val; GameData.saveSettings(); });
             y += gap;
             UI.drawSelector("JOYSTICK SIZE", ['Small', 'Medium', 'Large'], GameData.settings.joystickSize, cX, y, 300, 40, (val) => { GameData.settings.joystickSize = val; GameData.saveSettings(); });
             y += gap;
             UI.drawButton("RESET SAVE DATA", cX, y, 300, 50, '#500', () => { if (confirm("Wipe?")) { GameData.resetProgress(); SceneManager.changeScene('TITLE'); } });
             UI.drawButton('BACK', 20, canvas.height - 70, 100, 50, '#555', () => SceneManager.changeScene('TITLE'));
             UI.handleInput();
        }

        // --- SCENE OVERRIDES (HUB) ---
        function renderHub() {
             ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
             ctx.fillStyle = '#0ff'; ctx.font = '40px VT323'; ctx.textAlign = 'center'; ctx.fillText('THE SANCTUARY', canvas.width/2, 50);
             ctx.font = '24px VT323'; ctx.textAlign = 'left'; ctx.fillStyle = '#ff0'; ctx.fillText(`FRAGMENTS: ${GameData.progress.currency}`, 20, 40);
             const cX = canvas.width/2 - 100;
             UI.drawButton('ENTER THE GLITCH', cX, 120, 200, 50, '#f0f', () => SceneManager.changeScene('CHARACTER_SELECT'));
             UI.drawButton('UPGRADES', cX, 190, 200, 50, '#333', () => SceneManager.changeScene('SHOP'));
             UI.drawButton('BACK', 20, canvas.height - 70, 100, 50, '#555', () => SceneManager.changeScene('TITLE'));
             UI.handleInput();
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
